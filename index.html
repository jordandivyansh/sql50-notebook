<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 50 Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#17202B; --muted:#5A6676; --line:#D5DBE2; --line-strong:#B4BEC9;
  --side:#1B2530; --side-2:#232F3C; --side-ink:#CBD4DE; --side-muted:#7E8C9B; --side-active:#2E3C4B;
  --accent:#08796F; --accent-ink:#FFFFFF; --accent-soft:#D9EFEC; --accent-line:#9ED3CC;
  --keep:#FFF0A0; --keep-ink:#5E4C00; --drop-ink:#9B3A2B; --drop-bg:#FAEDEA;
  --star:#C98A00; --star-soft:#FBF0D3;
  --easy:#1D7F48; --medium:#A86A10; --hard:#B83227;
  --g0:#E2EBFB; --g1:#E1F2E6; --g2:#FBE9DA; --g3:#EEE4F8; --g4:#DCF0F0; --g5:#F9E2EA;
  --s0:#5B84D6; --s1:#4E9D69; --s2:#D08843; --s3:#9474C7; --s4:#3E9C9C; --s5:#C95F84;
  --code-bg:#1B2530; --code-ink:#D5DDE6; --code-k:#86D3C9; --code-f:#EFC46B; --code-s:#B3D88A; --code-n:#F1A27A; --code-c:#7E8C9B; --code-i:#C9B2F0;
  --radius-s:4px; --radius-m:8px;
  --mono:'Recursive', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --sans:'Recursive', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F151C; --surface:#161F29; --surface-2:#1B2531; --ink:#E2E8EE; --muted:#93A0AF; --line:#27323E; --line-strong:#3A4755;
  --side:#0A0F14; --side-2:#111820; --side-ink:#C3CDD8; --side-muted:#6F7D8C; --side-active:#1D2834;
  --accent:#3DC3B8; --accent-ink:#06201D; --accent-soft:#12332F; --accent-line:#24605A;
  --keep:rgba(255,214,0,.17); --keep-ink:#FFE27C; --drop-ink:#F0927E; --drop-bg:rgba(222,92,70,.09);
  --star:#F2B630; --star-soft:rgba(242,182,48,.14);
  --easy:#4CC383; --medium:#E3A641; --hard:#F0786C;
  --g0:rgba(91,132,214,.17); --g1:rgba(78,157,105,.17); --g2:rgba(208,136,67,.17); --g3:rgba(148,116,199,.19); --g4:rgba(62,156,156,.18); --g5:rgba(201,95,132,.17);
  --code-bg:#0A0F14; color-scheme: dark; }}
:root[data-theme="dark"]{
  --paper:#0F151C; --surface:#161F29; --surface-2:#1B2531; --ink:#E2E8EE; --muted:#93A0AF; --line:#27323E; --line-strong:#3A4755;
  --side:#0A0F14; --side-2:#111820; --side-ink:#C3CDD8; --side-muted:#6F7D8C; --side-active:#1D2834;
  --accent:#3DC3B8; --accent-ink:#06201D; --accent-soft:#12332F; --accent-line:#24605A;
  --keep:rgba(255,214,0,.17); --keep-ink:#FFE27C; --drop-ink:#F0927E; --drop-bg:rgba(222,92,70,.09);
  --star:#F2B630; --star-soft:rgba(242,182,48,.14);
  --easy:#4CC383; --medium:#E3A641; --hard:#F0786C;
  --g0:rgba(91,132,214,.17); --g1:rgba(78,157,105,.17); --g2:rgba(208,136,67,.17); --g3:rgba(148,116,199,.19); --g4:rgba(62,156,156,.18); --g5:rgba(201,95,132,.17);
  --code-bg:#0A0F14; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6;
  font-variation-settings:"MONO" 0, "CASL" 0; -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,.mono,pre,.grid{font-family:var(--mono); font-variation-settings:"MONO" 1, "CASL" 0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
button{font:inherit; color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100vh}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--side); color:var(--side-ink);
  display:flex; flex-direction:column; scrollbar-width:thin; scrollbar-color:var(--side-active) transparent}
.main{min-width:0}
.page{max-width:980px; padding:36px 48px 96px}
.topbar{display:none}
.scrim{display:none}

/* sidebar */
.brand{padding:22px 20px 14px; text-decoration:none; color:inherit; display:block}
.brand-name{font-size:1.35rem; font-weight:800; letter-spacing:-.01em; color:#fff; font-variation-settings:"MONO" 1,"CASL" 0}
:root[data-theme="light"] .brand-name{color:#fff}
.brand-sub{font-size:.82rem; color:var(--side-muted)}
.meter{height:6px; background:var(--side-2); border-radius:3px; margin:12px 0 4px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s}
.meter-label{font-size:.78rem; color:var(--side-muted)}
.side-search{margin:4px 14px 10px; position:relative}
.side-search input{width:100%; background:var(--side-2); border:1px solid transparent; color:var(--side-ink); border-radius:var(--radius-s);
  padding:8px 34px 8px 10px; font:inherit; font-size:.88rem}
.side-search input::placeholder{color:var(--side-muted)}
.side-search input:focus{outline:none; border-color:var(--accent)}
.side-search kbd{position:absolute; right:8px; top:8px; background:transparent; border-bottom-width:1px; font-family:var(--mono); font-size:.72rem; color:var(--side-muted);
  border:1px solid var(--side-active); border-radius:3px; padding:0 5px}
.side-nav{padding:0 8px 8px; display:flex; flex-direction:column; gap:1px}
.side-nav a{display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border-radius:var(--radius-s);
  color:var(--side-ink); text-decoration:none; font-size:.93rem; font-weight:560}
.side-nav a:hover{background:var(--side-2)}
.side-nav a.active{background:var(--side-active); color:#fff}
.count{font-family:var(--mono); font-size:.75rem; background:var(--side-2); border-radius:10px; padding:0 7px; color:var(--side-ink)}
.count.star{color:var(--star)}
.tree{padding:6px 8px 16px; border-top:1px solid var(--side-2); flex:1}
.tree details{margin-top:6px}
.tree summary{list-style:none; cursor:pointer; padding:6px 12px; font-size:.8rem; color:var(--side-muted); display:flex; justify-content:space-between; gap:8px; border-radius:var(--radius-s)}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{color:var(--side-ink)}
.tree summary .sec-n{font-family:var(--mono)}
.tree a{display:grid; grid-template-columns:12px 22px 1fr auto; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--radius-s);
  color:var(--side-ink); text-decoration:none; font-size:.86rem; line-height:1.35}
.tree a:hover{background:var(--side-2)}
.tree a.active{background:var(--side-active); color:#fff}
.tree a .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tree a .n{font-family:var(--mono); font-size:.74rem; color:var(--side-muted)}
.dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--side-muted)}
.dot.on{background:var(--accent); border-color:var(--accent)}
.tree .st{color:var(--star); font-size:.8rem}
.side-foot{padding:12px 14px 18px; border-top:1px solid var(--side-2); display:flex; flex-wrap:wrap; gap:6px}
.side-foot button{background:transparent; border:1px solid var(--side-active); color:var(--side-ink); border-radius:var(--radius-s); padding:5px 9px; font-size:.78rem; cursor:pointer}
.side-foot button:hover{background:var(--side-2)}
.persist-warn{font-size:.75rem; color:#F0B35A; padding:0 14px 10px}

/* type */
h1{font-size:2.05rem; line-height:1.18; letter-spacing:-.015em; margin:6px 0 10px; font-weight:780}
h2{font-size:1.28rem; line-height:1.3; margin:44px 0 12px; font-weight:720; letter-spacing:-.005em}
h3{font-size:1.02rem; margin:0 0 6px; font-weight:700}
p{margin:0 0 12px}
.lede{color:var(--muted); max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
p code, li code, td code, .note code, .lede code, .callout code, dd code{font-size:.88em; background:var(--surface-2); border:1px solid var(--line); border-radius:3px; padding:0 4px}

/* chips & buttons */
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{font-size:.78rem; border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:1px 9px; color:var(--muted); white-space:nowrap}
.chip.mono{font-size:.74rem}
.diff{font-weight:650; border-color:currentColor; background:transparent}
.diff.Easy{color:var(--easy)} .diff.Medium{color:var(--medium)} .diff.Hard{color:var(--hard)}
.btn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-s);
  padding:7px 13px; font-size:.9rem; font-weight:580; cursor:pointer; text-decoration:none; color:var(--ink); line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.on-solved{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
.btn.on-star{background:var(--star-soft); border-color:var(--star); color:var(--star)}
.btn.ghost{border-color:transparent; background:transparent; padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2); border-color:var(--line)}
.btn:disabled{opacity:.4; cursor:default}
.btn .ico{font-size:1rem; line-height:1}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px}

/* roadmap hero grid */
.board{margin:24px 0 8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px}
.board-row{display:grid; grid-template-columns:minmax(150px, 210px) 1fr auto; align-items:center; gap:14px; padding:5px 0}
.board-row + .board-row{border-top:1px dashed var(--line)}
.board-name{font-size:.88rem; font-weight:620; background:none; border:0; text-align:left; padding:0; cursor:pointer; color:var(--ink)}
.board-name:hover{color:var(--accent)}
.cells{display:flex; flex-wrap:wrap; gap:5px}
.cell{width:34px; height:34px; display:grid; place-items:center; border-radius:var(--radius-s); border:1.5px solid var(--line-strong);
  font-family:var(--mono); font-size:.78rem; color:var(--muted); text-decoration:none; position:relative; background:var(--surface)}
.cell:hover{border-color:var(--ink); color:var(--ink)}
.cell.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.cell.rev::after{content:""; position:absolute; top:-1px; right:-1px; border-style:solid; border-width:0 10px 10px 0; border-color:transparent var(--star) transparent transparent; border-top-right-radius:3px}
.board-count{font-family:var(--mono); font-size:.8rem; color:var(--muted); min-width:3.2em; text-align:right}
.board-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px solid var(--line)}
.board-legend span{display:inline-flex; gap:6px; align-items:center}
.mini{width:13px; height:13px; border-radius:3px; border:1.5px solid var(--line-strong); display:inline-block; position:relative}
.mini.on{background:var(--accent); border-color:var(--accent)}
.mini.rev::after{content:""; position:absolute; top:-1px; right:-1px; border-style:solid; border-width:0 6px 6px 0; border-color:transparent var(--star) transparent transparent}
.next-up{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 0}

.filters{display:flex; flex-wrap:wrap; gap:16px; margin:30px 0 4px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--radius-s); overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:5px 11px; font-size:.84rem; cursor:pointer; color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.seg-label{font-size:.84rem; color:var(--muted); margin-right:6px}

.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:40px; border-bottom:2px solid var(--ink); padding-bottom:6px}
.sec-head h2{margin:0}
.sec-head .muted{font-family:var(--mono); font-size:.85rem}
.sec-blurb{margin:8px 0 6px; color:var(--muted); font-size:.92rem}
table.list{width:100%; border-collapse:collapse}
table.list td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
table.list tr:hover td{background:var(--surface)}
table.list .num{font-family:var(--mono); font-size:.8rem; color:var(--muted); width:3.2em}
table.list .lc{font-family:var(--mono); font-size:.76rem; color:var(--muted); width:5.4em; white-space:nowrap}
table.list a.title{color:var(--ink); text-decoration:none; font-weight:580}
table.list a.title:hover{color:var(--accent); text-decoration:underline}
table.list .concepts{font-size:.78rem; color:var(--muted); margin-top:1px}
.check{width:22px; height:22px; border-radius:5px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer; display:grid; place-items:center; padding:0; color:transparent; font-size:.85rem; line-height:1}
.check.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.starbtn{background:none; border:0; cursor:pointer; font-size:1.05rem; color:var(--line-strong); padding:2px 4px; line-height:1}
.starbtn.on{color:var(--star)}
.empty-row td{color:var(--muted); font-size:.9rem; padding:14px 8px}

/* problem page */
.crumbs{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:.86rem; color:var(--muted)}
.crumbs a{color:var(--muted); text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.pn{display:flex; gap:4px}
.callout{border-left:4px solid var(--accent); background:var(--accent-soft); padding:10px 14px; border-radius:0 var(--radius-s) var(--radius-s) 0; margin:18px 0 0; font-size:.95rem}
.callout b{font-weight:700}
.task{font-size:1.04rem; max-width:72ch}
.returns{font-size:.92rem; color:var(--muted)}
.returns code{color:var(--ink)}
.tables{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start}
.tbl{min-width:0; max-width:100%}
.tbl-name{font-family:var(--mono); font-size:.86rem; font-weight:700; margin:0 0 6px; display:flex; gap:8px; align-items:baseline}
.tbl-name .muted{font-weight:400; font-size:.76rem}
.schema{font-size:.76rem; color:var(--muted); margin:0 0 6px; font-family:var(--mono); line-height:1.5}
.schema b{color:var(--ink); font-weight:600}
.pk{color:var(--star)}
.setup-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center}
details.plain > summary{cursor:pointer; color:var(--accent); font-size:.88rem; list-style:none}
details.plain > summary::-webkit-details-marker{display:none}
details.plain > summary::before{content:"▸ "; }
details.plain[open] > summary::before{content:"▾ "}
ol.think{padding-left:0; list-style:none; counter-reset:t; max-width:74ch; margin:0}
ol.think li{counter-increment:t; position:relative; padding:4px 0 10px 40px}
ol.think li::before{content:counter(t); position:absolute; left:0; top:3px; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink);
  display:grid; place-items:center; font-family:var(--mono); font-size:.8rem; font-weight:700}
ul.notes{padding-left:1.1em; max-width:76ch; margin:0}
ul.notes li{margin:0 0 8px}
ul.traps li::marker{content:"✕  "; color:var(--drop-ink); font-weight:700}
.two{display:grid; grid-template-columns:1fr 1fr; gap:28px}
.two h3{margin-bottom:10px}

/* result grid */
.grid-wrap{overflow-x:auto; width:fit-content; max-width:100%; border:1px solid var(--line-strong); border-radius:var(--radius-s); background:var(--surface)}
table.grid{border-collapse:collapse; font-size:.82rem; line-height:1.35; width:auto}
table.grid th{background:var(--surface-2); text-align:left; font-weight:650; padding:6px 12px; border-bottom:1.5px solid var(--line-strong); white-space:nowrap; color:var(--ink)}
table.grid th + th, table.grid td + td{border-left:1px solid var(--line)}
table.grid td{padding:5px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
table.grid tr:last-child td{border-bottom:0}
table.grid td.num{text-align:right}
table.grid th.comp{background:var(--accent-soft); color:var(--accent)}
table.grid td.comp{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.null{color:var(--muted); font-style:italic; font-variation-settings:"MONO" 1, "slnt" -10; opacity:.8}
.empty{color:var(--muted); font-style:italic}
table.grid tr.keep td{background:var(--keep); color:var(--keep-ink)}
table.grid tr.keep td.comp{background:var(--keep)}
table.grid tr.drop td{color:var(--drop-ink); background:var(--drop-bg); text-decoration:line-through; text-decoration-thickness:1px; opacity:.78}
table.grid tr.drop td.comp{text-decoration:none}
.has-grp:not(.has-keep) tr.g0 td{background:var(--g0)} .has-grp:not(.has-keep) tr.g1 td{background:var(--g1)}
.has-grp:not(.has-keep) tr.g2 td{background:var(--g2)} .has-grp:not(.has-keep) tr.g3 td{background:var(--g3)}
.has-grp:not(.has-keep) tr.g4 td{background:var(--g4)} .has-grp:not(.has-keep) tr.g5 td{background:var(--g5)}
.has-grp tr td:first-child{box-shadow:inset 5px 0 0 var(--sx, transparent)}
.has-grp tr.g0{--sx:var(--s0)} .has-grp tr.g1{--sx:var(--s1)} .has-grp tr.g2{--sx:var(--s2)} .has-grp tr.g3{--sx:var(--s3)} .has-grp tr.g4{--sx:var(--s4)} .has-grp tr.g5{--sx:var(--s5)}
.has-grp tr.gstart td{border-top:2px solid var(--line-strong)}
.has-grp tr td:first-child{padding-left:16px}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:.78rem; color:var(--muted); margin:10px 0 8px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:22px; height:12px; border-radius:2px; display:inline-block; border:1px solid var(--line-strong)}
.sw.keep{background:var(--keep)} .sw.drop{background:var(--drop-bg); position:relative}
.sw.drop::after{content:""; position:absolute; left:2px; right:2px; top:5px; border-top:1px solid var(--drop-ink)}
.sw.grp{background:linear-gradient(90deg, var(--s0) 0 4px, var(--g0) 4px 50%, var(--s2) 50% calc(50% + 4px), var(--g2) calc(50% + 4px))}
.sw.comp{background:var(--accent-soft); border-color:var(--accent-line)}

/* stepper */
.stepper{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px 18px; margin-top:10px}
.step-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:thin}
.step-tab{flex:0 0 auto; border:1px solid var(--line); background:var(--surface-2); border-radius:20px; padding:4px 12px 4px 5px; font-size:.82rem; cursor:pointer; display:inline-flex; gap:7px; align-items:center; color:var(--muted); max-width:260px}
.step-tab .sk{width:21px; height:21px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line-strong); font-family:var(--mono); font-size:.72rem; font-weight:700; color:var(--ink); flex:0 0 auto}
.step-tab .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.step-tab[aria-current="step"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.step-tab[aria-current="step"] .sk{background:var(--surface); color:var(--ink)}
.step-tab.result .sk{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.step-title{font-size:1.06rem; font-weight:700; margin:2px 0 4px}
.step-note{font-size:.93rem; max-width:76ch; margin-bottom:6px}
.step-foot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap}
.step-sql{margin-top:10px}

/* code */
.code{position:relative; background:var(--code-bg); border-radius:var(--radius-m); color:var(--code-ink); margin:8px 0 0}
.code pre{margin:0; padding:16px 72px 16px 18px; overflow-x:auto; font-size:.86rem; line-height:1.6; tab-size:2}
.code .copy{position:absolute; top:8px; right:8px; background:rgba(255,255,255,.08); color:var(--code-ink); border:1px solid rgba(255,255,255,.14); border-radius:var(--radius-s); padding:3px 9px; font-size:.75rem; cursor:pointer}
.code .copy:hover{background:rgba(255,255,255,.16)}
.code.small pre{font-size:.8rem; padding:12px 14px}
.hk{color:var(--code-k); font-weight:600} .hf{color:var(--code-f)} .hs{color:var(--code-s)} .hn{color:var(--code-n)} .hc{color:var(--code-c); font-style:italic} .hi{color:var(--code-i)}
.code .hk{font-variation-settings:"MONO" 1, "wght" 640}
.pipeline{display:flex; flex-wrap:wrap; gap:0; margin:14px 0 0; align-items:stretch; font-size:.78rem}
.pipe{padding:4px 10px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:var(--mono); margin-right:-1px; opacity:.55}
.pipe:first-child{border-radius:var(--radius-s) 0 0 var(--radius-s)}
.pipe:last-child{border-radius:0 var(--radius-s) var(--radius-s) 0}
.pipe.on{background:var(--ink); color:var(--surface); border-color:var(--ink); opacity:1; font-weight:650; position:relative; z-index:1}
.pipe-cap{font-size:.8rem; color:var(--muted); margin-top:6px}
.pipe-extra{display:inline-flex; gap:6px; margin-left:10px}
details.alt{border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); margin-top:10px}
details.alt > summary{cursor:pointer; padding:10px 14px; font-weight:620; display:flex; justify-content:space-between; gap:10px; align-items:center; list-style:none}
details.alt > summary::-webkit-details-marker{display:none}
details.alt > summary::after{content:"+"; font-family:var(--mono); color:var(--muted); font-size:1.1rem}
details.alt[open] > summary::after{content:"−"}
details.alt .body{padding:0 14px 14px}
.verified{font-size:.74rem; font-weight:500; color:var(--accent); margin-left:auto; padding-right:8px}
textarea.mynotes{width:100%; min-height:130px; resize:vertical; border:1px solid var(--line-strong); border-radius:var(--radius-m); background:var(--surface); color:var(--ink); padding:12px 14px; font:inherit; font-size:.94rem; line-height:1.55}
textarea.mynotes:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.saved{font-size:.78rem; color:var(--muted); min-height:1.2em; margin-top:4px}
.pager{display:flex; justify-content:space-between; gap:12px; margin-top:56px; padding-top:18px; border-top:1px solid var(--line)}
.pager a{text-decoration:none; color:var(--ink); max-width:46%}
.pager a:hover .pt{color:var(--accent)}
.pager .pl{font-size:.8rem; color:var(--muted)}
.pager .pt{font-weight:620}
.pager a.next{text-align:right; margin-left:auto}
.kbd-hint{font-size:.78rem; color:var(--muted); margin-top:18px}
kbd{font-family:var(--mono); font-size:.76em; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:3px; padding:0 4px; background:var(--surface)}

/* revisit */
.rv{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-m); padding:14px 16px; margin-top:10px; display:grid; grid-template-columns:1fr auto; gap:8px 16px}
.rv-title{font-weight:650; text-decoration:none; color:var(--ink)}
.rv-title:hover{color:var(--accent)}
.rv-meta{font-size:.8rem; color:var(--muted)}
.rv-note{grid-column:1 / -1; font-size:.88rem; background:var(--surface-2); border-radius:var(--radius-s); padding:8px 10px; white-space:pre-wrap; color:var(--ink)}
.rv-actions{display:flex; gap:6px; align-items:flex-start; flex-wrap:wrap; justify-content:flex-end}
.empty-state{border:1.5px dashed var(--line-strong); border-radius:var(--radius-m); padding:28px; color:var(--muted); margin-top:20px; max-width:620px}

/* interview */
.tabs{display:flex; gap:2px; border-bottom:2px solid var(--line); margin:22px 0 0; overflow-x:auto}
.tabs a{padding:9px 14px; text-decoration:none; color:var(--muted); font-weight:600; font-size:.93rem; border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--ink)}
.pat{border-top:1px solid var(--line); padding:20px 0 6px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:22px}
.pat:first-of-type{border-top:0}
.pat h3{font-size:1.05rem}
.pat .when{font-size:.9rem; color:var(--muted); margin-bottom:10px}
.pat .chips a{text-decoration:none}
.pat .chips a.chip:hover{border-color:var(--accent); color:var(--accent)}
table.cheat{width:100%; border-collapse:collapse; font-size:.88rem; margin-top:8px}
table.cheat th{text-align:left; font-weight:650; color:var(--muted); font-size:.8rem; border-bottom:1.5px solid var(--line-strong); padding:6px 8px}
table.cheat td{border-bottom:1px solid var(--line); padding:7px 8px; vertical-align:top}
table.cheat td:first-child{font-family:var(--mono); font-variation-settings:"MONO" 1; font-size:.82rem; font-weight:600; width:32%}
table.cheat td:last-child{font-family:var(--mono); font-variation-settings:"MONO" 1; font-size:.78rem; color:var(--muted); width:36%}
details.qa{border-bottom:1px solid var(--line)}
details.qa > summary{cursor:pointer; padding:12px 0; font-weight:620; list-style:none; display:flex; gap:12px; justify-content:space-between}
details.qa > summary::-webkit-details-marker{display:none}
details.qa > summary::after{content:"+"; font-family:var(--mono); color:var(--muted)}
details.qa[open] > summary::after{content:"−"}
details.qa .ans{padding:0 0 14px; max-width:78ch; font-size:.95rem}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 6px}
select.sel{font:inherit; font-size:.88rem; padding:6px 8px; border:1px solid var(--line-strong); border-radius:var(--radius-s); background:var(--surface); color:var(--ink)}
.card{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-m); padding:22px 24px; margin-top:14px; min-height:260px}
.card-top{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; font-size:.84rem; color:var(--muted)}
.card h3{font-size:1.32rem; margin:10px 0 8px}
.reveal{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line-strong)}
.recall{font-family:var(--mono); font-variation-settings:"MONO" 1; font-size:.92rem; background:var(--keep); color:var(--keep-ink); padding:8px 12px; border-radius:var(--radius-s); display:inline-block; margin:6px 0 4px}
.drill-nav{display:flex; justify-content:space-between; gap:8px; margin-top:16px; flex-wrap:wrap}
ol.frame{list-style:none; padding:0; counter-reset:f; margin:0}
ol.frame li{counter-increment:f; display:grid; grid-template-columns:44px 1fr; gap:6px; padding:12px 0; border-bottom:1px solid var(--line)}
ol.frame li::before{content:counter(f); font-family:var(--mono); font-weight:800; font-size:1.3rem; color:var(--accent)}
ol.frame b{display:block}
.order{display:flex; flex-direction:column; gap:0; max-width:620px; margin-top:6px}
.order div{display:grid; grid-template-columns:34px 170px 1fr; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:.92rem}
.order .on{font-family:var(--mono); font-weight:700}
.order .ix{font-family:var(--mono); color:var(--muted); font-size:.8rem}

/* toast */
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:var(--radius-s);
  font-size:.88rem; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:100}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width: 960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed; inset:0 auto 0 0; width:300px; z-index:60; transform:translateX(-100%); transition:transform .22s ease; visibility:hidden}
  .side.open{transform:none; visibility:visible; box-shadow:0 0 40px rgba(0,0,0,.35)}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:55; display:none}
  .scrim.show{display:block}
  .topbar{display:flex; position:sticky; top:0; z-index:40; align-items:center; gap:10px; background:var(--side); color:var(--side-ink); padding:10px 14px}
  .topbar button{background:none; border:1px solid var(--side-active); color:var(--side-ink); border-radius:var(--radius-s); padding:4px 10px; cursor:pointer}
  .topbar .tt{font-weight:700; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .page{padding:22px 16px 80px}
  h1{font-size:1.6rem}
  .two, .pat{grid-template-columns:1fr; gap:10px}
  .board{padding:14px}
  .board-row{grid-template-columns:1fr auto; gap:6px 10px}
  .board-row .cells{grid-column:1 / -1; order:3}
  .cell{width:30px; height:30px}
  table.list .lc, table.list .concepts{display:none}
  .order div{grid-template-columns:28px 130px 1fr}
  table.cheat td:last-child{display:none}
  table.cheat td:first-child{width:45%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
@media print{ .side,.topbar,.actions,.step-foot,.pager,.toast{display:none} .app{display:block} }

<script>
const P = [{"n":1,"id":1757,"slug":"recyclable-and-low-fat-products","title":"Recyclable and Low Fat Products","sec":"select","diff":"Easy","concepts":["WHERE","AND"],"pattern":"Plain row filter on two flag columns","prompt":"A `Products` table stores two Y/N flags per product: `low_fats` and `recyclable`. List the ids of products where **both** flags are `'Y'`.","returns":"product_id (any order)","approach":["Output grain: one row per product, only the id column.","Both conditions must hold at the same time → combine with `AND`.","No joins, no grouping — a single `WHERE` does it."],"remember":["ENUM values compare like strings — always quote them: `'Y'`.","`AND` binds tighter than `OR`. When you mix them, add parentheses."],"pitfalls":["Writing `low_fats = Y` (unquoted) makes MySQL look for a column named Y."],"recall":"WHERE low_fats='Y' AND recyclable='Y'.","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, low_fats ENUM('Y','N'), recyclable ENUM('Y','N'));\nINSERT INTO Products VALUES (0,'Y','N'),(1,'Y','Y'),(2,'N','Y'),(3,'Y','Y'),(4,'N','N');","solution":"SELECT product_id\nFROM Products\nWHERE low_fats = 'Y'\n  AND recyclable = 'Y';","steps":[{"t":"Test every row against both flags","note":"`WHERE` keeps a row only when the whole condition is TRUE. Rows 1 and 3 pass both tests.","sql":"SELECT product_id, low_fats, recyclable,\n       low_fats = 'Y' AS `+low_fats='Y'`,\n       recyclable = 'Y' AS `+recyclable='Y'`,\n       (low_fats = 'Y' AND recyclable = 'Y') AS _keep\nFROM Products ORDER BY product_id","cols":["product_id","low_fats","recyclable","+low_fats='Y'","+recyclable='Y'","_keep"],"rows":[[0,"Y","N",1,0,0],[1,"Y","Y",1,1,1],[2,"N","Y",0,1,0],[3,"Y","Y",1,1,1],[4,"N","N",0,0,0]]}],"alts":[{"label":"Tuple comparison","sql":"SELECT product_id\nFROM Products\nWHERE (low_fats, recyclable) = ('Y', 'Y');","note":"MySQL supports row constructors — handy when matching several columns at once.","verified":true}],"inputs":[{"name":"Products","cols":["product_id","low_fats","recyclable"],"rows":[[0,"Y","N"],[1,"Y","Y"],[2,"N","Y"],[3,"Y","Y"],[4,"N","N"]]}],"schema":[{"name":"Products","cols":[["product_id","int","PRI"],["low_fats","enum('Y','N')",""],["recyclable","enum('Y','N')",""]]}],"output":{"cols":["product_id"],"rows":[[1],[3]]},"ordered":false},{"n":2,"id":584,"slug":"find-customer-referee","title":"Find Customer Referee","sec":"select","diff":"Easy","concepts":["WHERE","NULL","IS NULL"],"pattern":"Negative filter on a nullable column","prompt":"Each customer may have been referred by another customer (`referee_id`, can be NULL). Return the names of customers who were **not** referred by the customer with id = 2 — this includes customers referred by nobody.","returns":"name (any order)","approach":["\"Not referred by 2\" sounds like `referee_id <> 2` — but NULL referees must be included too.","Any comparison with NULL (`NULL <> 2`) is UNKNOWN, and `WHERE` drops UNKNOWN rows.","So add the NULL case explicitly with `OR referee_id IS NULL`."],"remember":["SQL uses three-valued logic: TRUE, FALSE, UNKNOWN. `WHERE` keeps TRUE only.","`= NULL` / `<> NULL` never match anything — use `IS NULL` / `IS NOT NULL`.","`<=>` is MySQL's null-safe equal: `NULL <=> NULL` is 1."],"pitfalls":["`WHERE referee_id != 2` alone fails the test case with NULL referees — the classic first trap of SQL 50."],"recall":"<> 2 OR IS NULL — NULL comparisons are UNKNOWN.","setup":"CREATE TABLE Customer (id INT PRIMARY KEY, name VARCHAR(25), referee_id INT);\nINSERT INTO Customer VALUES (1,'Will',NULL),(2,'Jane',NULL),(3,'Alex',2),(4,'Bill',NULL),(5,'Zack',1),(6,'Mark',2);","solution":"SELECT name\nFROM Customer\nWHERE referee_id <> 2\n   OR referee_id IS NULL;","steps":[{"t":"Naive filter: referee_id <> 2","note":"The comparison is NULL for Will, Jane and Bill, so `WHERE` silently drops them. Only Zack survives — wrong.","sql":"SELECT id, name, referee_id,\n       referee_id <> 2 AS `+referee_id <> 2`,\n       (referee_id <> 2) IS TRUE AS _keep\nFROM Customer ORDER BY id","cols":["id","name","referee_id","+referee_id <> 2","_keep"],"rows":[[1,"Will",null,null,0],[2,"Jane",null,null,0],[3,"Alex",2,0,0],[4,"Bill",null,null,0],[5,"Zack",1,1,1],[6,"Mark",2,0,0]]},{"t":"Fix: OR referee_id IS NULL","note":"Now the NULL rows are TRUE too. Only Alex and Mark (referred by 2) are excluded.","sql":"SELECT id, name, referee_id,\n       referee_id IS NULL AS `+is_null`,\n       (referee_id <> 2 OR referee_id IS NULL) AS _keep\nFROM Customer ORDER BY id","cols":["id","name","referee_id","+is_null","_keep"],"rows":[[1,"Will",null,1,1],[2,"Jane",null,1,1],[3,"Alex",2,0,0],[4,"Bill",null,1,1],[5,"Zack",1,0,1],[6,"Mark",2,0,0]]}],"alts":[{"label":"IFNULL to a sentinel","sql":"SELECT name\nFROM Customer\nWHERE IFNULL(referee_id, 0) <> 2;","note":"Replace NULL with a value that can never be 2.","verified":true},{"label":"Null-safe equality <=>","sql":"SELECT name\nFROM Customer\nWHERE NOT (referee_id <=> 2);","note":"`<=>` returns 1/0 and never NULL, so NOT works as expected.","verified":true}],"inputs":[{"name":"Customer","cols":["id","name","referee_id"],"rows":[[1,"Will",null],[2,"Jane",null],[3,"Alex",2],[4,"Bill",null],[5,"Zack",1],[6,"Mark",2]]}],"schema":[{"name":"Customer","cols":[["id","int","PRI"],["name","varchar(25)",""],["referee_id","int",""]]}],"output":{"cols":["name"],"rows":[["Will"],["Jane"],["Bill"],["Zack"]]},"ordered":false},{"n":3,"id":595,"slug":"big-countries","title":"Big Countries","sec":"select","diff":"Easy","concepts":["WHERE","OR","UNION"],"pattern":"Filter with OR across two columns","prompt":"A country is **big** if its area is at least 3,000,000 km² **or** its population is at least 25,000,000. Report name, population and area of big countries.","returns":"name, population, area (any order)","approach":["Either condition is enough → `OR`.","\"At least\" means `>=` (inclusive).","Select only the three requested columns."],"remember":["\"At least\" → `>=`; \"more than\" → `>`. Read boundaries carefully.","Interview talking point: `OR` on two different columns can stop MySQL from using one index; rewriting as `UNION` lets each branch use its own index."],"pitfalls":["Using `UNION ALL` in the alternative duplicates countries that match both conditions."],"recall":"area >= 3M OR population >= 25M (or UNION of the two).","setup":"CREATE TABLE World (name VARCHAR(255), continent VARCHAR(255), area INT, population INT, gdp BIGINT);\nINSERT INTO World VALUES\n('India','Asia',3287263,1428600000,3550000000000),\n('Nepal','Asia',147516,30900000,40000000000),\n('Bhutan','Asia',38394,780000,3000000000),\n('Australia','Oceania',7692024,26000000,1700000000000),\n('Sri Lanka','Asia',65610,22000000,84000000000),\n('Mongolia','Asia',1564116,3400000,20000000000);","solution":"SELECT name, population, area\nFROM World\nWHERE area >= 3000000\n   OR population >= 25000000;","steps":[{"t":"Evaluate both conditions per country","note":"India and Australia pass both; Nepal passes on population only. One TRUE is enough for OR.","sql":"SELECT name, area, population,\n       area >= 3000000 AS `+big_area`,\n       population >= 25000000 AS `+big_population`,\n       (area >= 3000000 OR population >= 25000000) AS _keep\nFROM World ORDER BY name","cols":["name","area","population","+big_area","+big_population","_keep"],"rows":[["Australia",7692024,26000000,1,1,1],["Bhutan",38394,780000,0,0,0],["India",3287263,1428600000,1,1,1],["Mongolia",1564116,3400000,0,0,0],["Nepal",147516,30900000,0,1,1],["Sri Lanka",65610,22000000,0,0,0]]}],"alts":[{"label":"UNION of two filters","sql":"SELECT name, population, area FROM World WHERE area >= 3000000\nUNION\nSELECT name, population, area FROM World WHERE population >= 25000000;","note":"UNION (not UNION ALL) removes countries that satisfy both conditions, like India and Australia. This form lets MySQL use a separate index for each condition.","verified":true}],"inputs":[{"name":"World","cols":["name","continent","area","population","gdp"],"rows":[["India","Asia",3287263,1428600000,3550000000000],["Nepal","Asia",147516,30900000,40000000000],["Bhutan","Asia",38394,780000,3000000000],["Australia","Oceania",7692024,26000000,1700000000000],["Sri Lanka","Asia",65610,22000000,84000000000],["Mongolia","Asia",1564116,3400000,20000000000]]}],"schema":[{"name":"World","cols":[["name","varchar(255)",""],["continent","varchar(255)",""],["area","int",""],["population","int",""],["gdp","bigint",""]]}],"output":{"cols":["name","population","area"],"rows":[["India",1428600000,3287263],["Nepal",30900000,147516],["Australia",26000000,7692024]]},"ordered":false},{"n":4,"id":1148,"slug":"article-views-i","title":"Article Views I","sec":"select","diff":"Easy","concepts":["DISTINCT","ORDER BY","Alias"],"pattern":"Filter where two columns are equal, then de-duplicate","prompt":"The `Views` log (it can contain duplicate rows) records who viewed which article. Find every author who viewed **at least one of their own** articles. Return their ids sorted ascending, as column `id`.","returns":"id (sorted ascending)","approach":["\"Viewed own article\" → the row's `author_id` equals its `viewer_id`.","An author can do that many times (and the log has duplicates) → `DISTINCT`.","Rename to `id` and sort ascending as asked."],"remember":["`DISTINCT` applies to the whole selected row, not one column.","MySQL lets you use a SELECT alias (`id`) in `ORDER BY`, but not in `WHERE`."],"pitfalls":["Forgetting `ORDER BY id` — this problem checks the order."],"recall":"DISTINCT author_id WHERE author_id = viewer_id ORDER BY id.","ordered":true,"setup":"CREATE TABLE Views (article_id INT, author_id INT, viewer_id INT, view_date DATE);\nINSERT INTO Views VALUES\n(1,3,5,'2024-01-01'),(1,3,3,'2024-01-02'),(2,7,7,'2024-01-01'),(2,7,7,'2024-01-03'),\n(4,7,1,'2024-01-04'),(3,4,4,'2024-01-05'),(3,4,4,'2024-01-05'),(5,9,2,'2024-01-06');","solution":"SELECT DISTINCT author_id AS id\nFROM Views\nWHERE author_id = viewer_id\nORDER BY id;","steps":[{"t":"Keep self-views only","note":"Five rows are self-views, but they belong to only three authors.","sql":"SELECT article_id, author_id, viewer_id, view_date,\n       author_id = viewer_id AS _keep\nFROM Views ORDER BY article_id, view_date","cols":["article_id","author_id","viewer_id","view_date","_keep"],"rows":[[1,3,5,"2024-01-01",0],[1,3,3,"2024-01-02",1],[2,7,7,"2024-01-01",1],[2,7,7,"2024-01-03",1],[3,4,4,"2024-01-05",1],[3,4,4,"2024-01-05",1],[4,7,1,"2024-01-04",0],[5,9,2,"2024-01-06",0]]},{"t":"Collapse each author to one row","note":"Each colour band is one author. `DISTINCT author_id` turns every band into a single row.","sql":"SELECT author_id AS _grp, author_id, viewer_id, article_id, view_date\nFROM Views WHERE author_id = viewer_id ORDER BY author_id, view_date","cols":["_grp","author_id","viewer_id","article_id","view_date"],"rows":[[3,3,3,1,"2024-01-02"],[4,4,4,3,"2024-01-05"],[4,4,4,3,"2024-01-05"],[7,7,7,2,"2024-01-01"],[7,7,7,2,"2024-01-03"]]}],"alts":[{"label":"GROUP BY instead of DISTINCT","sql":"SELECT author_id AS id\nFROM Views\nWHERE author_id = viewer_id\nGROUP BY author_id\nORDER BY id;","note":"Same result; GROUP BY also de-duplicates.","verified":true}],"inputs":[{"name":"Views","cols":["article_id","author_id","viewer_id","view_date"],"rows":[[1,3,5,"2024-01-01"],[1,3,3,"2024-01-02"],[2,7,7,"2024-01-01"],[2,7,7,"2024-01-03"],[4,7,1,"2024-01-04"],[3,4,4,"2024-01-05"],[3,4,4,"2024-01-05"],[5,9,2,"2024-01-06"]]}],"schema":[{"name":"Views","cols":[["article_id","int",""],["author_id","int",""],["viewer_id","int",""],["view_date","date",""]]}],"output":{"cols":["id"],"rows":[[3],[4],[7]]}},{"n":5,"id":1683,"slug":"invalid-tweets","title":"Invalid Tweets","sec":"select","diff":"Easy","concepts":["CHAR_LENGTH","String functions"],"pattern":"Filter on string length","prompt":"A tweet is **invalid** if its content has more than 15 characters. Return the ids of invalid tweets.","returns":"tweet_id (any order)","approach":["\"Number of characters\" → `CHAR_LENGTH()`.","\"More than 15\" is strict → `> 15`."],"remember":["`CHAR_LENGTH()` counts characters; `LENGTH()` counts **bytes**. They differ for any non-ASCII text.","LeetCode data is ASCII, so both pass there — but say CHAR_LENGTH in interviews."],"pitfalls":["Using `>= 15` — a 15-character tweet is valid."],"recall":"CHAR_LENGTH(content) > 15 (not LENGTH → bytes).","setup":"CREATE TABLE Tweets (tweet_id INT PRIMARY KEY, content VARCHAR(50));\nINSERT INTO Tweets VALUES (1,'Let us Code'),(2,'More than fifteen chars here!'),(3,'नमस्ते दुनिया'),(4,'SQL rocks!!!!!!');","solution":"SELECT tweet_id\nFROM Tweets\nWHERE CHAR_LENGTH(content) > 15;","steps":[{"t":"Characters vs bytes","note":"The Hindi tweet is 13 characters but 37 bytes in UTF-8. `LENGTH() > 15` would wrongly mark it invalid. Tweet 4 is exactly 15 → still valid.","sql":"SELECT tweet_id, content,\n       CHAR_LENGTH(content) AS `+CHAR_LENGTH`,\n       LENGTH(content) AS `+LENGTH (bytes)`,\n       CHAR_LENGTH(content) > 15 AS _keep\nFROM Tweets ORDER BY tweet_id","cols":["tweet_id","content","+CHAR_LENGTH","+LENGTH (bytes)","_keep"],"rows":[[1,"Let us Code",11,11,0],[2,"More than fifteen chars here!",29,29,1],[3,"नमस्ते दुनिया",13,37,0],[4,"SQL rocks!!!!!!",15,15,0]]}],"alts":[],"inputs":[{"name":"Tweets","cols":["tweet_id","content"],"rows":[[1,"Let us Code"],[2,"More than fifteen chars here!"],[3,"नमस्ते दुनिया"],[4,"SQL rocks!!!!!!"]]}],"schema":[{"name":"Tweets","cols":[["tweet_id","int","PRI"],["content","varchar(50)",""]]}],"output":{"cols":["tweet_id"],"rows":[[2]]},"ordered":false},{"n":6,"id":1378,"slug":"replace-employee-id-with-the-unique-identifier","title":"Replace Employee ID With The Unique Identifier","sec":"joins","diff":"Easy","concepts":["LEFT JOIN"],"pattern":"Keep every row of the main table → LEFT JOIN","prompt":"`Employees` has id and name; `EmployeeUNI` maps some employee ids to a `unique_id`. Show each employee's unique id (NULL if they have none) next to their name.","returns":"unique_id, name (any order)","approach":["Every employee must appear, even without a match → the employee table is the \"preserved\" side.","Put it on the left of a `LEFT JOIN`; unmatched rows get NULL for `unique_id`."],"remember":["\"Show X even if it has no Y\" → `X LEFT JOIN Y`.","Unmatched right-side columns become NULL."],"pitfalls":["Using plain `JOIN` (INNER) loses employees without a unique id."],"recall":"Employees LEFT JOIN EmployeeUNI.","setup":"CREATE TABLE Employees (id INT PRIMARY KEY, name VARCHAR(20));\nCREATE TABLE EmployeeUNI (id INT, unique_id INT, PRIMARY KEY (id, unique_id));\nINSERT INTO Employees VALUES (1,'Aarav'),(7,'Bina'),(11,'Chetan'),(90,'Divya'),(3,'Esha');\nINSERT INTO EmployeeUNI VALUES (3,1),(11,2),(90,3);","solution":"SELECT u.unique_id, e.name\nFROM Employees e\nLEFT JOIN EmployeeUNI u\n       ON e.id = u.id;","steps":[{"t":"LEFT JOIN keeps all employees","note":"Aarav and Bina have no partner row, so the `u.*` columns are NULL. An INNER JOIN would drop them.","sql":"SELECT e.id AS `e.id`, e.name, u.id AS `u.id`, u.unique_id\nFROM Employees e LEFT JOIN EmployeeUNI u ON e.id = u.id\nORDER BY e.id","cols":["e.id","name","u.id","unique_id"],"rows":[[1,"Aarav",null,null],[3,"Esha",3,1],[7,"Bina",null,null],[11,"Chetan",11,2],[90,"Divya",90,3]]}],"alts":[{"label":"RIGHT JOIN (tables swapped)","sql":"SELECT u.unique_id, e.name\nFROM EmployeeUNI u\nRIGHT JOIN Employees e ON e.id = u.id;","note":"Equivalent; most people standardise on LEFT JOIN for readability.","verified":true}],"inputs":[{"name":"Employees","cols":["id","name"],"rows":[[1,"Aarav"],[3,"Esha"],[7,"Bina"],[11,"Chetan"],[90,"Divya"]]},{"name":"EmployeeUNI","cols":["id","unique_id"],"rows":[[3,1],[11,2],[90,3]]}],"schema":[{"name":"Employees","cols":[["id","int","PRI"],["name","varchar(20)",""]]},{"name":"EmployeeUNI","cols":[["id","int","PRI"],["unique_id","int","PRI"]]}],"output":{"cols":["unique_id","name"],"rows":[[null,"Aarav"],[1,"Esha"],[null,"Bina"],[2,"Chetan"],[3,"Divya"]]},"ordered":false},{"n":7,"id":1068,"slug":"product-sales-analysis-i","title":"Product Sales Analysis I","sec":"joins","diff":"Easy","concepts":["INNER JOIN","USING"],"pattern":"Look up a name for each fact row → INNER JOIN","prompt":"For every sale in `Sales`, report the product's name (from `Product`), the year and the price.","returns":"product_name, year, price (any order)","approach":["Output grain: one row per sale.","Each sale has exactly one product → INNER JOIN to fetch the name."],"remember":["`JOIN` = `INNER JOIN`: keeps only matched pairs.","Alias tables (`s`, `p`) and prefix columns to avoid ambiguity errors."],"pitfalls":[],"recall":"Sales JOIN Product on product_id.","setup":"CREATE TABLE Sales (sale_id INT, product_id INT, year INT, quantity INT, price INT, PRIMARY KEY (sale_id, year));\nCREATE TABLE Product (product_id INT PRIMARY KEY, product_name VARCHAR(10));\nINSERT INTO Product VALUES (10,'Redmi'),(20,'iPhone'),(30,'Pixel');\nINSERT INTO Sales VALUES (1,10,2021,10,12000),(2,10,2022,12,11000),(3,20,2022,5,70000),(4,20,2023,7,72000);","solution":"SELECT p.product_name, s.year, s.price\nFROM Sales s\nJOIN Product p\n  ON s.product_id = p.product_id;","steps":[{"t":"Match each sale to its product","note":"Pixel has no sales, so it never appears — fine, the question is about sales.","sql":"SELECT s.sale_id, s.product_id, p.product_name, s.year, s.price\nFROM Sales s JOIN Product p ON s.product_id = p.product_id\nORDER BY s.sale_id","cols":["sale_id","product_id","product_name","year","price"],"rows":[[1,10,"Redmi",2021,12000],[2,10,"Redmi",2022,11000],[3,20,"iPhone",2022,70000],[4,20,"iPhone",2023,72000]]}],"alts":[{"label":"USING shorthand","sql":"SELECT p.product_name, s.year, s.price\nFROM Sales s\nJOIN Product p USING (product_id);","note":"`USING(col)` works when the join column has the same name in both tables.","verified":true}],"inputs":[{"name":"Sales","cols":["sale_id","product_id","year","quantity","price"],"rows":[[1,10,2021,10,12000],[2,10,2022,12,11000],[3,20,2022,5,70000],[4,20,2023,7,72000]]},{"name":"Product","cols":["product_id","product_name"],"rows":[[10,"Redmi"],[20,"iPhone"],[30,"Pixel"]]}],"schema":[{"name":"Sales","cols":[["sale_id","int","PRI"],["product_id","int",""],["year","int","PRI"],["quantity","int",""],["price","int",""]]},{"name":"Product","cols":[["product_id","int","PRI"],["product_name","varchar(10)",""]]}],"output":{"cols":["product_name","year","price"],"rows":[["Redmi",2021,12000],["Redmi",2022,11000],["iPhone",2022,70000],["iPhone",2023,72000]]},"ordered":false},{"n":8,"id":1581,"slug":"customer-who-visited-but-did-not-make-any-transactions","title":"Customer Who Visited but Did Not Make Any Transactions","sec":"joins","diff":"Easy","concepts":["LEFT JOIN","IS NULL","Anti-join","GROUP BY"],"pattern":"Anti-join: rows in A with no match in B","prompt":"`Visits` lists mall visits; `Transactions` lists purchases made during a visit. For each customer, count the visits in which they bought **nothing**.","returns":"customer_id, count_no_trans (any order)","approach":["\"Visits without transactions\" = rows in Visits that have no partner in Transactions → anti-join.","LEFT JOIN, then keep rows where the right side is NULL.","Count those per customer."],"remember":["Anti-join template: `A LEFT JOIN B ON … WHERE B.pk IS NULL`.","Test a column of B that can't be NULL in a real match (its primary key).","`NOT EXISTS` is the NULL-safe alternative to `NOT IN`."],"pitfalls":["Putting `t.transaction_id IS NULL` in the `ON` clause instead of `WHERE` keeps every visit."],"recall":"LEFT JOIN Transactions WHERE t.transaction_id IS NULL, GROUP BY customer.","setup":"CREATE TABLE Visits (visit_id INT PRIMARY KEY, customer_id INT);\nCREATE TABLE Transactions (transaction_id INT PRIMARY KEY, visit_id INT, amount INT);\nINSERT INTO Visits VALUES (1,101),(2,102),(3,101),(4,103),(5,104),(6,103),(7,103),(8,105);\nINSERT INTO Transactions VALUES (11,1,500),(12,1,250),(13,4,900),(14,8,120);","solution":"SELECT v.customer_id,\n       COUNT(*) AS count_no_trans\nFROM Visits v\nLEFT JOIN Transactions t\n       ON v.visit_id = t.visit_id\nWHERE t.transaction_id IS NULL\nGROUP BY v.customer_id;","steps":[{"t":"LEFT JOIN visits to transactions","note":"Visit 1 had two purchases so it appears twice. Visits with no purchase have NULL on the right.","sql":"SELECT v.visit_id, v.customer_id, t.transaction_id, t.amount\nFROM Visits v LEFT JOIN Transactions t ON v.visit_id = t.visit_id\nORDER BY v.visit_id, t.transaction_id","cols":["visit_id","customer_id","transaction_id","amount"],"rows":[[1,101,11,500],[1,101,12,250],[2,102,null,null],[3,101,null,null],[4,103,13,900],[5,104,null,null],[6,103,null,null],[7,103,null,null],[8,105,14,120]]},{"t":"WHERE t.transaction_id IS NULL","note":"Only the NULL rows survive — these are the empty-handed visits.","sql":"SELECT v.visit_id, v.customer_id, t.transaction_id,\n       t.transaction_id IS NULL AS _keep\nFROM Visits v LEFT JOIN Transactions t ON v.visit_id = t.visit_id\nORDER BY v.visit_id, t.transaction_id","cols":["visit_id","customer_id","transaction_id","_keep"],"rows":[[1,101,11,0],[1,101,12,0],[2,102,null,1],[3,101,null,1],[4,103,13,0],[5,104,null,1],[6,103,null,1],[7,103,null,1],[8,105,14,0]]},{"t":"GROUP BY customer_id","note":"Customer 103 has two such visits; everyone else has one. Customer 105 never appears.","sql":"SELECT v.customer_id AS _grp, v.customer_id, v.visit_id\nFROM Visits v LEFT JOIN Transactions t ON v.visit_id = t.visit_id\nWHERE t.transaction_id IS NULL\nORDER BY v.customer_id, v.visit_id","cols":["_grp","customer_id","visit_id"],"rows":[[101,101,3],[102,102,2],[103,103,6],[103,103,7],[104,104,5]]}],"alts":[{"label":"NOT IN","sql":"SELECT customer_id, COUNT(*) AS count_no_trans\nFROM Visits\nWHERE visit_id NOT IN (SELECT visit_id FROM Transactions)\nGROUP BY customer_id;","note":"Safe here because Transactions.visit_id is never NULL. If the subquery could return NULL, NOT IN returns no rows at all.","verified":true},{"label":"NOT EXISTS","sql":"SELECT v.customer_id, COUNT(*) AS count_no_trans\nFROM Visits v\nWHERE NOT EXISTS (SELECT 1 FROM Transactions t WHERE t.visit_id = v.visit_id)\nGROUP BY v.customer_id;","note":"NULL-safe and usually optimised to the same anti-join plan.","verified":true}],"inputs":[{"name":"Visits","cols":["visit_id","customer_id"],"rows":[[1,101],[2,102],[3,101],[4,103],[5,104],[6,103],[7,103],[8,105]]},{"name":"Transactions","cols":["transaction_id","visit_id","amount"],"rows":[[11,1,500],[12,1,250],[13,4,900],[14,8,120]]}],"schema":[{"name":"Visits","cols":[["visit_id","int","PRI"],["customer_id","int",""]]},{"name":"Transactions","cols":[["transaction_id","int","PRI"],["visit_id","int",""],["amount","int",""]]}],"output":{"cols":["customer_id","count_no_trans"],"rows":[[102,1],[101,1],[104,1],[103,2]]},"ordered":false},{"n":9,"id":197,"slug":"rising-temperature","title":"Rising Temperature","sec":"joins","diff":"Easy","concepts":["Self join","DATEDIFF","LAG"],"pattern":"Compare a row with the previous calendar day","prompt":"`Weather` has one temperature per date. Return the ids of dates whose temperature is higher than on the **previous day** (yesterday).","returns":"id (any order)","approach":["Each row must be compared with another row of the same table → self join.","Pair condition: the other row's date is exactly one day earlier → `DATEDIFF(a, b) = 1`.","Then keep pairs where today is warmer."],"remember":["Never use `id + 1` for \"previous day\" — ids are not in date order here.","`DATEDIFF(a, b)` returns a − b in days.","`LAG()` returns the previous row, not the previous date — check the gap."],"pitfalls":["Joining on `w1.id = w2.id + 1` fails when ids are shuffled or dates have gaps."],"recall":"Self join ON DATEDIFF(today, yesterday) = 1 AND warmer.","setup":"CREATE TABLE Weather (id INT PRIMARY KEY, recordDate DATE, temperature INT);\nINSERT INTO Weather VALUES\n(1,'2024-01-03',20),(2,'2024-01-01',10),(3,'2024-01-02',25),\n(4,'2024-01-04',30),(5,'2024-01-06',35),(6,'2024-01-07',38);","solution":"SELECT today.id\nFROM Weather today\nJOIN Weather yesterday\n  ON DATEDIFF(today.recordDate, yesterday.recordDate) = 1\nWHERE today.temperature > yesterday.temperature;","steps":[{"t":"Pair each day with yesterday (LEFT JOIN to see misses)","note":"Jan 6 is warmer than the previous row (Jan 4) but Jan 5 is missing, so it has no 'yesterday' and is excluded. The inner JOIN in the solution simply drops such rows.","sql":"SELECT today.id, today.recordDate AS today_date, today.temperature AS today_temp,\n       y.recordDate AS yesterday_date, y.temperature AS yesterday_temp,\n       IFNULL(today.temperature > y.temperature, 0) AS _keep\nFROM Weather today\nLEFT JOIN Weather y ON DATEDIFF(today.recordDate, y.recordDate) = 1\nORDER BY today.recordDate","cols":["id","today_date","today_temp","yesterday_date","yesterday_temp","_keep"],"rows":[[2,"2024-01-01",10,null,null,0],[3,"2024-01-02",25,"2024-01-01",10,1],[1,"2024-01-03",20,"2024-01-02",25,0],[4,"2024-01-04",30,"2024-01-03",20,1],[5,"2024-01-06",35,null,null,0],[6,"2024-01-07",38,"2024-01-06",35,1]]}],"alts":[{"label":"DATE_SUB in the join","sql":"SELECT w1.id\nFROM Weather w1\nJOIN Weather w2\n  ON w2.recordDate = DATE_SUB(w1.recordDate, INTERVAL 1 DAY)\nWHERE w1.temperature > w2.temperature;","note":"Same logic; keeps the date column bare on one side, which is index-friendly.","verified":true},{"label":"LAG with a date check","sql":"SELECT id\nFROM (\n  SELECT id, recordDate, temperature,\n         LAG(recordDate)  OVER (ORDER BY recordDate) AS prev_date,\n         LAG(temperature) OVER (ORDER BY recordDate) AS prev_temp\n  FROM Weather\n) t\nWHERE DATEDIFF(recordDate, prev_date) = 1\n  AND temperature > prev_temp;","note":"LAG gives the previous *row*; you still must check that row is exactly one day earlier.","verified":true}],"inputs":[{"name":"Weather","cols":["id","recordDate","temperature"],"rows":[[1,"2024-01-03",20],[2,"2024-01-01",10],[3,"2024-01-02",25],[4,"2024-01-04",30],[5,"2024-01-06",35],[6,"2024-01-07",38]]}],"schema":[{"name":"Weather","cols":[["id","int","PRI"],["recordDate","date",""],["temperature","int",""]]}],"output":{"cols":["id"],"rows":[[4],[3],[6]]},"ordered":false},{"n":10,"id":1661,"slug":"average-time-of-process-per-machine","title":"Average Time of Process per Machine","sec":"joins","diff":"Easy","concepts":["Self join","AVG","ROUND"],"pattern":"Pair 'start' and 'end' rows of the same entity","prompt":"`Activity` logs a `start` row and an `end` row (with a timestamp) for every process on every machine. For each machine, compute the average time a process takes (end − start), rounded to 3 decimals.","returns":"machine_id, processing_time (any order)","approach":["A duration needs two rows (start, end) side by side → self join on (machine_id, process_id).","Fix the roles in the join: left copy = start row, right copy = end row.","Average the differences per machine and round to 3."],"remember":["Self join = put two rows of the same entity on one line.","Put the role filters (`'start'` / `'end'`) in the join so each pair appears once.","`ROUND(x, 3)` — LeetCode checks the rounding."],"pitfalls":["Without the activity_type filters you get 4 pairs per process (start-start, start-end, …)."],"recall":"Self join start↔end on machine+process; ROUND(AVG(end-start),3).","setup":"CREATE TABLE Activity (machine_id INT, process_id INT, activity_type ENUM('start','end'), timestamp DECIMAL(8,3));\nINSERT INTO Activity VALUES\n(0,0,'start',0.500),(0,0,'end',1.200),(0,1,'start',2.000),(0,1,'end',2.900),\n(1,0,'start',0.250),(1,0,'end',1.000),(1,1,'start',3.100),(1,1,'end',3.600),\n(2,0,'start',1.000),(2,0,'end',2.333);","solution":"SELECT s.machine_id,\n       ROUND(AVG(e.timestamp - s.timestamp), 3) AS processing_time\nFROM Activity s\nJOIN Activity e\n  ON  s.machine_id   = e.machine_id\n  AND s.process_id   = e.process_id\n  AND s.activity_type = 'start'\n  AND e.activity_type = 'end'\nGROUP BY s.machine_id;","steps":[{"t":"Line up start and end rows","note":"One row per process. Machine 0: (0.7 + 0.9) / 2 = 0.800.","sql":"SELECT s.machine_id AS _grp, s.machine_id, s.process_id,\n       s.timestamp AS start_ts, e.timestamp AS end_ts,\n       e.timestamp - s.timestamp AS `+duration`\nFROM Activity s JOIN Activity e\n  ON s.machine_id = e.machine_id AND s.process_id = e.process_id\n AND s.activity_type = 'start' AND e.activity_type = 'end'\nORDER BY s.machine_id, s.process_id","cols":["_grp","machine_id","process_id","start_ts","end_ts","+duration"],"rows":[[0,0,0,"0.500","1.200","0.700"],[0,0,1,"2.000","2.900","0.900"],[1,1,0,"0.250","1.000","0.750"],[1,1,1,"3.100","3.600","0.500"],[2,2,0,"1.000","2.333","1.333"]]}],"alts":[{"label":"Conditional aggregation (no join)","sql":"SELECT machine_id,\n       ROUND(SUM(CASE WHEN activity_type = 'end' THEN timestamp ELSE -timestamp END)\n             / COUNT(DISTINCT process_id), 3) AS processing_time\nFROM Activity\nGROUP BY machine_id;","note":"Sum of ends minus sum of starts = total duration; divide by number of processes.","verified":true}],"inputs":[{"name":"Activity","cols":["machine_id","process_id","activity_type","timestamp"],"rows":[[0,0,"start","0.500"],[0,0,"end","1.200"],[0,1,"start","2.000"],[0,1,"end","2.900"],[1,0,"start","0.250"],[1,0,"end","1.000"],[1,1,"start","3.100"],[1,1,"end","3.600"],[2,0,"start","1.000"],[2,0,"end","2.333"]]}],"schema":[{"name":"Activity","cols":[["machine_id","int",""],["process_id","int",""],["activity_type","enum('start','end')",""],["timestamp","decimal(8,3)",""]]}],"output":{"cols":["machine_id","processing_time"],"rows":[[0,"0.800"],[1,"0.625"],[2,"1.333"]]},"ordered":false},{"n":11,"id":577,"slug":"employee-bonus","title":"Employee Bonus","sec":"joins","diff":"Easy","concepts":["LEFT JOIN","NULL"],"pattern":"LEFT JOIN + filter that must also keep NULLs","prompt":"Report the name and bonus of every employee whose bonus is **less than 1000** — employees with no bonus row count too (show NULL).","returns":"name, bonus (any order)","approach":["Employees without a bonus row must appear → `LEFT JOIN Bonus`.","Filter `bonus < 1000`, remembering NULL < 1000 is UNKNOWN → add `OR b.bonus IS NULL`."],"remember":["Same NULL trap as #2, now after a LEFT JOIN.","Filters on the right table in `WHERE` can silently turn a LEFT JOIN into an INNER JOIN — unless you allow NULL."],"pitfalls":["`WHERE b.bonus < 1000` alone drops every employee without a bonus."],"recall":"LEFT JOIN Bonus WHERE bonus < 1000 OR bonus IS NULL.","setup":"CREATE TABLE Employee (empId INT PRIMARY KEY, name VARCHAR(255), supervisor INT, salary INT);\nCREATE TABLE Bonus (empId INT PRIMARY KEY, bonus INT);\nINSERT INTO Employee VALUES (3,'Riya',NULL,4000),(1,'Kabir',3,1000),(2,'Meera',1,2000),(4,'Tanvi',3,4000),(5,'Om',3,3000);\nINSERT INTO Bonus VALUES (2,500),(4,2000),(5,1000);","solution":"SELECT e.name, b.bonus\nFROM Employee e\nLEFT JOIN Bonus b\n       ON e.empId = b.empId\nWHERE b.bonus < 1000\n   OR b.bonus IS NULL;","steps":[{"t":"LEFT JOIN, then test bonus < 1000","note":"Kabir and Riya have NULL bonus: the plain comparison is NULL, so they need the `IS NULL` branch. Om's 1000 is not < 1000.","sql":"SELECT e.empId, e.name, b.bonus,\n       b.bonus < 1000 AS `+bonus < 1000`,\n       (b.bonus < 1000 OR b.bonus IS NULL) AS _keep\nFROM Employee e LEFT JOIN Bonus b ON e.empId = b.empId\nORDER BY e.empId","cols":["empId","name","bonus","+bonus < 1000","_keep"],"rows":[[1,"Kabir",null,null,1],[2,"Meera",500,1,1],[3,"Riya",null,null,1],[4,"Tanvi",2000,0,0],[5,"Om",1000,0,0]]}],"alts":[{"label":"IFNULL","sql":"SELECT e.name, b.bonus\nFROM Employee e\nLEFT JOIN Bonus b ON e.empId = b.empId\nWHERE IFNULL(b.bonus, 0) < 1000;","note":"Treat a missing bonus as 0 for the comparison only; the output still shows NULL.","verified":true}],"inputs":[{"name":"Employee","cols":["empId","name","supervisor","salary"],"rows":[[1,"Kabir",3,1000],[2,"Meera",1,2000],[3,"Riya",null,4000],[4,"Tanvi",3,4000],[5,"Om",3,3000]]},{"name":"Bonus","cols":["empId","bonus"],"rows":[[2,500],[4,2000],[5,1000]]}],"schema":[{"name":"Employee","cols":[["empId","int","PRI"],["name","varchar(255)",""],["supervisor","int",""],["salary","int",""]]},{"name":"Bonus","cols":[["empId","int","PRI"],["bonus","int",""]]}],"output":{"cols":["name","bonus"],"rows":[["Kabir",null],["Meera",500],["Riya",null]]},"ordered":false},{"n":12,"id":1280,"slug":"students-and-examinations","title":"Students and Examinations","sec":"joins","diff":"Easy","concepts":["CROSS JOIN","LEFT JOIN","COUNT(col)"],"pattern":"Every combination → CROSS JOIN skeleton + LEFT JOIN facts","prompt":"For **every** student and **every** subject, count how many times the student sat that exam (0 if never). `Examinations` may contain duplicates. Order by student_id, then subject_name.","returns":"student_id, student_name, subject_name, attended_exams (ordered)","approach":["Output must include combinations that never happened (0) → build the full grid first: Students × Subjects = CROSS JOIN.","Attach real exam rows with LEFT JOIN on both keys.","Count a column from the exam table so missing rows count as 0."],"remember":["\"For every A and every B\" → `A CROSS JOIN B` builds the grid.","`COUNT(*)` counts rows; `COUNT(col)` counts non-NULL values. After a LEFT JOIN, count a right-side column.","With `ONLY_FULL_GROUP_BY`, list every non-aggregated SELECT column in GROUP BY."],"pitfalls":["Starting from Examinations misses students who sat no exam (Bela–Physics, …)."],"recall":"Students CROSS JOIN Subjects LEFT JOIN Exams; COUNT(e.subject_name).","ordered":true,"setup":"CREATE TABLE Students (student_id INT PRIMARY KEY, student_name VARCHAR(20));\nCREATE TABLE Subjects (subject_name VARCHAR(20) PRIMARY KEY);\nCREATE TABLE Examinations (student_id INT, subject_name VARCHAR(20));\nINSERT INTO Students VALUES (1,'Anil'),(2,'Bela'),(13,'Chirag');\nINSERT INTO Subjects VALUES ('Math'),('Physics'),('Programming');\nINSERT INTO Examinations VALUES\n(1,'Math'),(1,'Physics'),(1,'Programming'),(2,'Programming'),(1,'Physics'),(1,'Math'),\n(13,'Math'),(13,'Programming'),(13,'Physics'),(2,'Math'),(1,'Math');","solution":"SELECT s.student_id, s.student_name, sub.subject_name,\n       COUNT(e.subject_name) AS attended_exams\nFROM Students s\nCROSS JOIN Subjects sub\nLEFT JOIN Examinations e\n       ON e.student_id = s.student_id\n      AND e.subject_name = sub.subject_name\nGROUP BY s.student_id, s.student_name, sub.subject_name\nORDER BY s.student_id, sub.subject_name;","steps":[{"t":"CROSS JOIN: the full student × subject grid","note":"3 students × 3 subjects = 9 rows. This is the shape of the final answer.","sql":"SELECT s.student_id, s.student_name, sub.subject_name\nFROM Students s CROSS JOIN Subjects sub\nORDER BY s.student_id, sub.subject_name","cols":["student_id","student_name","subject_name"],"rows":[[1,"Anil","Math"],[1,"Anil","Physics"],[1,"Anil","Programming"],[2,"Bela","Math"],[2,"Bela","Physics"],[2,"Bela","Programming"],[13,"Chirag","Math"],[13,"Chirag","Physics"],[13,"Chirag","Programming"]]},{"t":"LEFT JOIN exam rows onto the grid","note":"Anil's Math repeats 3 times (duplicates multiply rows). Bela–Physics has no exam → one row with NULL.","sql":"SELECT CONCAT(s.student_id, sub.subject_name) AS _grp,\n       s.student_id, s.student_name, sub.subject_name, e.subject_name AS `e.subject_name`\nFROM Students s CROSS JOIN Subjects sub\nLEFT JOIN Examinations e ON e.student_id = s.student_id AND e.subject_name = sub.subject_name\nORDER BY s.student_id, sub.subject_name","cols":["_grp","student_id","student_name","subject_name","e.subject_name"],"rows":[["1Math",1,"Anil","Math","Math"],["1Math",1,"Anil","Math","Math"],["1Math",1,"Anil","Math","Math"],["1Physics",1,"Anil","Physics","Physics"],["1Physics",1,"Anil","Physics","Physics"],["1Programming",1,"Anil","Programming","Programming"],["2Math",2,"Bela","Math","Math"],["2Physics",2,"Bela","Physics",null],["2Programming",2,"Bela","Programming","Programming"],["13Math",13,"Chirag","Math","Math"],["13Physics",13,"Chirag","Physics","Physics"],["13Programming",13,"Chirag","Programming","Programming"]]},{"t":"COUNT(e.subject_name) per cell","note":"COUNT(*) counts the NULL placeholder row as 1. COUNT(column) skips NULLs → 0 for Bela–Physics.","sql":"SELECT s.student_id, sub.subject_name,\n       COUNT(*) AS `+COUNT(*) (wrong)`,\n       COUNT(e.subject_name) AS `+COUNT(e.col) (right)`\nFROM Students s CROSS JOIN Subjects sub\nLEFT JOIN Examinations e ON e.student_id = s.student_id AND e.subject_name = sub.subject_name\nGROUP BY s.student_id, sub.subject_name\nORDER BY s.student_id, sub.subject_name","cols":["student_id","subject_name","+COUNT(*) (wrong)","+COUNT(e.col) (right)"],"rows":[[1,"Math",3,3],[1,"Physics",2,2],[1,"Programming",1,1],[2,"Math",1,1],[2,"Physics",1,0],[2,"Programming",1,1],[13,"Math",1,1],[13,"Physics",1,1],[13,"Programming",1,1]]}],"alts":[{"label":"Pre-aggregate, then join","sql":"SELECT s.student_id, s.student_name, sub.subject_name,\n       IFNULL(c.cnt, 0) AS attended_exams\nFROM Students s\nCROSS JOIN Subjects sub\nLEFT JOIN (\n  SELECT student_id, subject_name, COUNT(*) AS cnt\n  FROM Examinations\n  GROUP BY student_id, subject_name\n) c ON c.student_id = s.student_id AND c.subject_name = sub.subject_name\nORDER BY s.student_id, sub.subject_name;","note":"Counting first keeps the join small on big tables.","verified":true}],"inputs":[{"name":"Students","cols":["student_id","student_name"],"rows":[[1,"Anil"],[2,"Bela"],[13,"Chirag"]]},{"name":"Subjects","cols":["subject_name"],"rows":[["Math"],["Physics"],["Programming"]]},{"name":"Examinations","cols":["student_id","subject_name"],"rows":[[1,"Math"],[1,"Physics"],[1,"Programming"],[2,"Programming"],[1,"Physics"],[1,"Math"],[13,"Math"],[13,"Programming"],[13,"Physics"],[2,"Math"],[1,"Math"]]}],"schema":[{"name":"Students","cols":[["student_id","int","PRI"],["student_name","varchar(20)",""]]},{"name":"Subjects","cols":[["subject_name","varchar(20)","PRI"]]},{"name":"Examinations","cols":[["student_id","int",""],["subject_name","varchar(20)",""]]}],"output":{"cols":["student_id","student_name","subject_name","attended_exams"],"rows":[[1,"Anil","Math",3],[1,"Anil","Physics",2],[1,"Anil","Programming",1],[2,"Bela","Math",1],[2,"Bela","Physics",0],[2,"Bela","Programming",1],[13,"Chirag","Math",1],[13,"Chirag","Physics",1],[13,"Chirag","Programming",1]]}},{"n":13,"id":570,"slug":"managers-with-at-least-5-direct-reports","title":"Managers with at Least 5 Direct Reports","sec":"joins","diff":"Medium","concepts":["Self join","GROUP BY","HAVING"],"pattern":"Self join manager ↔ reports, then filter groups","prompt":"In `Employee`, `managerId` points to another row's `id`. Return the names of managers who have **at least five** direct reports.","returns":"name (any order)","approach":["Reports and managers live in the same table → self join `e.managerId = m.id`.","One row per (manager, report) pair → GROUP BY manager and count.","Filter groups with `HAVING COUNT(*) >= 5`."],"remember":["`WHERE` filters rows before grouping; `HAVING` filters groups after.","Group by the manager's **id**, not just name — two managers can share a name."],"pitfalls":["`GROUP BY m.name` alone would merge two different managers who happen to share a name."],"recall":"Self join e.managerId = m.id, GROUP BY m.id HAVING COUNT(*) >= 5.","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), department VARCHAR(255), managerId INT);\nINSERT INTO Employee VALUES\n(101,'Sanjay','A',NULL),(102,'Dev','A',101),(103,'Isha','A',101),(104,'Amit','A',101),\n(105,'Anya','A',101),(106,'Ron','B',101),(107,'Tara','B',106),(108,'Neel','B',106),\n(109,'Pia','B',106),(110,'Zoya','B',106);","solution":"SELECT m.name\nFROM Employee m\nJOIN Employee e\n  ON e.managerId = m.id\nGROUP BY m.id, m.name\nHAVING COUNT(*) >= 5;","steps":[{"t":"Self join: manager next to each report","note":"Sanjay has 5 report rows, Ron has 4.","sql":"SELECT m.id AS _grp, m.id AS manager_id, m.name AS manager, e.id AS report_id, e.name AS report\nFROM Employee m JOIN Employee e ON e.managerId = m.id\nORDER BY m.id, e.id","cols":["_grp","manager_id","manager","report_id","report"],"rows":[[101,101,"Sanjay",102,"Dev"],[101,101,"Sanjay",103,"Isha"],[101,101,"Sanjay",104,"Amit"],[101,101,"Sanjay",105,"Anya"],[101,101,"Sanjay",106,"Ron"],[106,106,"Ron",107,"Tara"],[106,106,"Ron",108,"Neel"],[106,106,"Ron",109,"Pia"],[106,106,"Ron",110,"Zoya"]]},{"t":"GROUP BY manager, HAVING COUNT(*) >= 5","note":"`HAVING` filters after grouping — `WHERE` can't see COUNT(*).","sql":"SELECT m.id, m.name, COUNT(*) AS `+reports`, COUNT(*) >= 5 AS _keep\nFROM Employee m JOIN Employee e ON e.managerId = m.id\nGROUP BY m.id, m.name ORDER BY m.id","cols":["id","name","+reports","_keep"],"rows":[[101,"Sanjay",5,1],[106,"Ron",4,0]]}],"alts":[{"label":"Subquery on managerId","sql":"SELECT name\nFROM Employee\nWHERE id IN (\n  SELECT managerId\n  FROM Employee\n  GROUP BY managerId\n  HAVING COUNT(*) >= 5\n);","note":"Count reports per managerId first, then look up the names.","verified":true}],"inputs":[{"name":"Employee","cols":["id","name","department","managerId"],"rows":[[101,"Sanjay","A",null],[102,"Dev","A",101],[103,"Isha","A",101],[104,"Amit","A",101],[105,"Anya","A",101],[106,"Ron","B",101],[107,"Tara","B",106],[108,"Neel","B",106],[109,"Pia","B",106],[110,"Zoya","B",106]]}],"schema":[{"name":"Employee","cols":[["id","int","PRI"],["name","varchar(255)",""],["department","varchar(255)",""],["managerId","int",""]]}],"output":{"cols":["name"],"rows":[["Sanjay"]]},"ordered":false},{"n":14,"id":1934,"slug":"confirmation-rate","title":"Confirmation Rate","sec":"joins","diff":"Medium","concepts":["LEFT JOIN","AVG(condition)","IF","ROUND"],"pattern":"Rate = AVG of a 0/1 flag; LEFT JOIN so zero-activity users stay","prompt":"Users sign up (`Signups`) and later request confirmation messages (`Confirmations`, action is `confirmed` or `timeout`). A user's confirmation rate = confirmed messages ÷ all requested messages, or 0 if they requested none. Round to 2 decimals.","returns":"user_id, confirmation_rate (any order)","approach":["Every signed-up user must appear (even with no requests) → `Signups LEFT JOIN Confirmations`.","Turn each row into a 1 (confirmed) or 0 (anything else, including NULL).","The average of a 0/1 column is exactly the rate. Round to 2."],"remember":["**AVG(condition)** = fraction of rows where the condition is true. Multiply by 100 for a percentage.","`IF(cond, 1, 0)` maps NULL to 0 (because `NULL = 'confirmed'` is not TRUE).","`SUM(cond)` counts TRUE rows (MySQL treats TRUE as 1)."],"pitfalls":["Using `AVG(c.action = 'confirmed')` directly gives NULL for users with no requests — AVG ignores NULL."],"recall":"Signups LEFT JOIN Confirmations; ROUND(AVG(IF(action='confirmed',1,0)),2).","setup":"CREATE TABLE Signups (user_id INT PRIMARY KEY, time_stamp DATETIME);\nCREATE TABLE Confirmations (user_id INT, time_stamp DATETIME, action ENUM('confirmed','timeout'), PRIMARY KEY (user_id, time_stamp));\nINSERT INTO Signups VALUES (3,'2024-03-21 10:16:13'),(7,'2024-01-04 13:57:59'),(2,'2024-07-29 23:09:44'),(6,'2024-12-09 10:39:37');\nINSERT INTO Confirmations VALUES\n(3,'2024-01-06 03:30:46','timeout'),(3,'2024-07-14 14:00:00','timeout'),\n(7,'2024-06-12 11:57:29','confirmed'),(7,'2024-06-13 12:58:28','confirmed'),(7,'2024-06-14 13:59:27','confirmed'),\n(2,'2024-01-22 00:00:00','confirmed'),(2,'2024-02-28 23:59:59','timeout');","solution":"SELECT s.user_id,\n       ROUND(AVG(IF(c.action = 'confirmed', 1, 0)), 2) AS confirmation_rate\nFROM Signups s\nLEFT JOIN Confirmations c\n       ON s.user_id = c.user_id\nGROUP BY s.user_id;","steps":[{"t":"LEFT JOIN and flag confirmed rows","note":"User 6 never requested a message: one row with NULL action → flag 0. AVG over that single 0 = 0.00 ✓.","sql":"SELECT s.user_id AS _grp, s.user_id, c.time_stamp, c.action,\n       IF(c.action = 'confirmed', 1, 0) AS `+is_confirmed`\nFROM Signups s LEFT JOIN Confirmations c ON s.user_id = c.user_id\nORDER BY s.user_id, c.time_stamp","cols":["_grp","user_id","time_stamp","action","+is_confirmed"],"rows":[[2,2,"2024-01-22 00:00:00","confirmed",1],[2,2,"2024-02-28 23:59:59","timeout",0],[3,3,"2024-01-06 03:30:46","timeout",0],[3,3,"2024-07-14 14:00:00","timeout",0],[6,6,null,null,0],[7,7,"2024-06-12 11:57:29","confirmed",1],[7,7,"2024-06-13 12:58:28","confirmed",1],[7,7,"2024-06-14 13:59:27","confirmed",1]]}],"alts":[{"label":"SUM / COUNT with IFNULL","sql":"SELECT s.user_id,\n       ROUND(IFNULL(SUM(c.action = 'confirmed') / COUNT(c.action), 0), 2) AS confirmation_rate\nFROM Signups s\nLEFT JOIN Confirmations c ON s.user_id = c.user_id\nGROUP BY s.user_id;","note":"For user 6, SUM/COUNT is NULL/0 = NULL → IFNULL turns it into 0.","verified":true}],"inputs":[{"name":"Signups","cols":["user_id","time_stamp"],"rows":[[2,"2024-07-29 23:09:44"],[3,"2024-03-21 10:16:13"],[6,"2024-12-09 10:39:37"],[7,"2024-01-04 13:57:59"]]},{"name":"Confirmations","cols":["user_id","time_stamp","action"],"rows":[[2,"2024-01-22 00:00:00","confirmed"],[2,"2024-02-28 23:59:59","timeout"],[3,"2024-01-06 03:30:46","timeout"],[3,"2024-07-14 14:00:00","timeout"],[7,"2024-06-12 11:57:29","confirmed"],[7,"2024-06-13 12:58:28","confirmed"],[7,"2024-06-14 13:59:27","confirmed"]]}],"schema":[{"name":"Signups","cols":[["user_id","int","PRI"],["time_stamp","datetime",""]]},{"name":"Confirmations","cols":[["user_id","int","PRI"],["time_stamp","datetime","PRI"],["action","enum('confirmed','timeout')",""]]}],"output":{"cols":["user_id","confirmation_rate"],"rows":[[2,"0.50"],[3,"0.00"],[6,"0.00"],[7,"1.00"]]},"ordered":false},{"n":15,"id":620,"slug":"not-boring-movies","title":"Not Boring Movies","sec":"agg","diff":"Easy","concepts":["WHERE","MOD","ORDER BY DESC"],"pattern":"Filter + sort","prompt":"From `Cinema`, list movies with an **odd** id whose description is not `'boring'`, sorted by rating from highest to lowest.","returns":"id, movie, description, rating (rating descending)","approach":["Two row conditions → `WHERE … AND …`.","Odd id → `id % 2 = 1`.","Sort by rating descending."],"remember":["`<>` and `!=` are the same.","`ORDER BY col DESC` — default direction is ASC."],"pitfalls":["Forgetting `DESC` — this problem checks the order."],"recall":"id % 2 = 1 AND description <> 'boring' ORDER BY rating DESC.","ordered":true,"setup":"CREATE TABLE Cinema (id INT PRIMARY KEY, movie VARCHAR(255), description VARCHAR(255), rating DECIMAL(2,1));\nINSERT INTO Cinema VALUES\n(1,'Lagaan','epic sports drama',8.1),(2,'Swades','slow burn',8.2),(3,'Race 3','boring',1.9),\n(4,'Dangal','biopic',8.3),(5,'Andhadhun','thriller',8.2),(6,'Queen','feel good',8.1),(7,'Tumbbad','horror',8.4);","solution":"SELECT *\nFROM Cinema\nWHERE id % 2 = 1\n  AND description <> 'boring'\nORDER BY rating DESC;","steps":[{"t":"Check both conditions","note":"Race 3 has an odd id but is boring; even ids are out regardless.","sql":"SELECT id, movie, description, rating,\n       id % 2 = 1 AS `+odd_id`, description <> 'boring' AS `+not_boring`,\n       (id % 2 = 1 AND description <> 'boring') AS _keep\nFROM Cinema ORDER BY id","cols":["id","movie","description","rating","+odd_id","+not_boring","_keep"],"rows":[[1,"Lagaan","epic sports drama","8.1",1,1,1],[2,"Swades","slow burn","8.2",0,1,0],[3,"Race 3","boring","1.9",1,0,0],[4,"Dangal","biopic","8.3",0,1,0],[5,"Andhadhun","thriller","8.2",1,1,1],[6,"Queen","feel good","8.1",0,1,0],[7,"Tumbbad","horror","8.4",1,1,1]]}],"alts":[{"label":"MOD()","sql":"SELECT *\nFROM Cinema\nWHERE MOD(id, 2) = 1 AND description != 'boring'\nORDER BY rating DESC;","note":"`MOD(a,b)`, `a % b` and `a MOD b` are identical in MySQL.","verified":true}],"inputs":[{"name":"Cinema","cols":["id","movie","description","rating"],"rows":[[1,"Lagaan","epic sports drama","8.1"],[2,"Swades","slow burn","8.2"],[3,"Race 3","boring","1.9"],[4,"Dangal","biopic","8.3"],[5,"Andhadhun","thriller","8.2"],[6,"Queen","feel good","8.1"],[7,"Tumbbad","horror","8.4"]]}],"schema":[{"name":"Cinema","cols":[["id","int","PRI"],["movie","varchar(255)",""],["description","varchar(255)",""],["rating","decimal(2,1)",""]]}],"output":{"cols":["id","movie","description","rating"],"rows":[[7,"Tumbbad","horror","8.4"],[5,"Andhadhun","thriller","8.2"],[1,"Lagaan","epic sports drama","8.1"]]}},{"n":16,"id":1251,"slug":"average-selling-price","title":"Average Selling Price","sec":"agg","diff":"Easy","concepts":["LEFT JOIN","BETWEEN","Weighted average","IFNULL"],"pattern":"Range join (date BETWEEN start AND end) + weighted average","prompt":"`Prices` gives a product's price for date ranges; `UnitsSold` records units sold on a date. For every product, compute the average selling price = total revenue ÷ total units, rounded to 2. Products with no sales get 0.","returns":"product_id, average_price (any order)","approach":["A sale belongs to the price row whose range contains its date → join on product **and** `purchase_date BETWEEN start_date AND end_date`.","Average selling price is weighted by units: Σ(price×units) ÷ Σ(units) — not AVG(price).","Products with no sales must stay → LEFT JOIN from Prices, and IFNULL the NULL result to 0."],"remember":["Weighted average = `SUM(value * weight) / SUM(weight)`.","With a LEFT JOIN, put conditions on the right table in `ON`, not `WHERE` — otherwise unmatched rows are filtered out.","`BETWEEN a AND b` is inclusive on both ends."],"pitfalls":["`AVG(price)` ignores how many units were sold at each price.","Putting the date condition in WHERE drops product 3."],"recall":"Prices LEFT JOIN UnitsSold ON id AND date BETWEEN; ROUND(IFNULL(SUM(p*u)/SUM(u),0),2).","setup":"CREATE TABLE Prices (product_id INT, start_date DATE, end_date DATE, price INT, PRIMARY KEY (product_id, start_date, end_date));\nCREATE TABLE UnitsSold (product_id INT, purchase_date DATE, units INT);\nINSERT INTO Prices VALUES\n(1,'2024-02-17','2024-02-28',5),(1,'2024-03-01
