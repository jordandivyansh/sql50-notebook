ter_id AS id FROM RequestAccepted UNION ALL SELECT accepter_id FROM RequestAccepted) p\nGROUP BY id ORDER BY num DESC, id","cols":["id","num","_keep"],"rows":[[30,4,1],[10,2,0],[20,2,0],[40,1,0],[50,1,0]]}],"alts":[{"label":"Ties-safe (follow-up)","sql":"WITH counts AS (\n  SELECT id, COUNT(*) AS num\n  FROM (SELECT requester_id AS id FROM RequestAccepted\n        UNION ALL\n        SELECT accepter_id FROM RequestAccepted) p\n  GROUP BY id\n)\nSELECT id, num\nFROM counts\nWHERE num = (SELECT MAX(num) FROM counts);","note":"Returns every person tied for the maximum.","verified":true}],"inputs":[{"name":"RequestAccepted","cols":["requester_id","accepter_id","accept_date"],"rows":[[10,20,"2024-05-01"],[10,30,"2024-05-02"],[20,30,"2024-05-03"],[30,40,"2024-05-04"],[50,30,"2024-05-05"]]}],"schema":[{"name":"RequestAccepted","cols":[["requester_id","int","PRI"],["accepter_id","int","PRI"],["accept_date","date",""]]}],"output":{"cols":["id","num"],"rows":[[30,4]]},"ordered":false},{"n":42,"id":585,"slug":"investments-in-2016","title":"Investments in 2016","sec":"subq","diff":"Medium","concepts":["IN + GROUP BY HAVING","Tuple IN","COUNT() OVER"],"pattern":"Two independent group-size conditions on the same rows","prompt":"Sum `tiv_2016` for policyholders who (a) share their `tiv_2015` value with at least one other policyholder, and (b) have a unique location (no one else has the same (lat, lon)). Round to 2.","returns":"tiv_2016 (single value)","approach":["Condition (a): tiv_2015 belongs to a group of size > 1.","Condition (b): (lat, lon) belongs to a group of size = 1.","Each is a GROUP BY … HAVING subquery; combine with AND, then SUM."],"remember":["Multi-column membership: `(a, b) IN (SELECT a, b …)`.","`COUNT(*) OVER (PARTITION BY …)` = \"how many rows share this value\" on every row."],"pitfalls":["Requiring (a) and (b) against different subsets — both are evaluated over the whole table."],"recall":"tiv_2015 IN (count>1) AND (lat,lon) IN (count=1); ROUND(SUM(tiv_2016),2).","setup":"CREATE TABLE Insurance (pid INT PRIMARY KEY, tiv_2015 DECIMAL(10,2), tiv_2016 DECIMAL(10,2), lat DECIMAL(5,2), lon DECIMAL(5,2));\nINSERT INTO Insurance VALUES\n(1,15,10,28.61,77.20),(2,25,20,19.07,72.87),(3,15,30,19.07,72.87),\n(4,15,45,12.97,77.59),(5,35,50,22.57,88.36),(6,25,15,13.08,80.27);","solution":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016\nFROM Insurance\nWHERE tiv_2015 IN (\n        SELECT tiv_2015 FROM Insurance\n        GROUP BY tiv_2015 HAVING COUNT(*) > 1)\n  AND (lat, lon) IN (\n        SELECT lat, lon FROM Insurance\n        GROUP BY lat, lon HAVING COUNT(*) = 1);","steps":[{"t":"Group sizes for both conditions","note":"pid 3 shares tiv_2015 but also shares a location with pid 2 → out. pid 5 is unique on tiv_2015 → out. 10 + 45 + 15 = 70.00.","sql":"SELECT pid, tiv_2015, tiv_2016, lat, lon,\n       COUNT(*) OVER (PARTITION BY tiv_2015) AS `+same_tiv_2015`,\n       COUNT(*) OVER (PARTITION BY lat, lon) AS `+same_location`,\n       (COUNT(*) OVER (PARTITION BY tiv_2015) > 1 AND COUNT(*) OVER (PARTITION BY lat, lon) = 1) AS _keep\nFROM Insurance ORDER BY pid","cols":["pid","tiv_2015","tiv_2016","lat","lon","+same_tiv_2015","+same_location","_keep"],"rows":[[1,"15.00","10.00","28.61","77.20",3,1,1],[2,"25.00","20.00","19.07","72.87",2,2,0],[3,"15.00","30.00","19.07","72.87",3,2,0],[4,"15.00","45.00","12.97","77.59",3,1,1],[5,"35.00","50.00","22.57","88.36",1,1,0],[6,"25.00","15.00","13.08","80.27",2,1,1]]}],"alts":[{"label":"Window counts","sql":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016\nFROM (\n  SELECT tiv_2016,\n         COUNT(*) OVER (PARTITION BY tiv_2015) AS same_tiv,\n         COUNT(*) OVER (PARTITION BY lat, lon) AS same_loc\n  FROM Insurance\n) t\nWHERE same_tiv > 1 AND same_loc = 1;","note":"One pass: attach both group sizes to every row, then filter.","verified":true}],"inputs":[{"name":"Insurance","cols":["pid","tiv_2015","tiv_2016","lat","lon"],"rows":[[1,"15.00","10.00","28.61","77.20"],[2,"25.00","20.00","19.07","72.87"],[3,"15.00","30.00","19.07","72.87"],[4,"15.00","45.00","12.97","77.59"],[5,"35.00","50.00","22.57","88.36"],[6,"25.00","15.00","13.08","80.27"]]}],"schema":[{"name":"Insurance","cols":[["pid","int","PRI"],["tiv_2015","decimal(10,2)",""],["tiv_2016","decimal(10,2)",""],["lat","decimal(5,2)",""],["lon","decimal(5,2)",""]]}],"output":{"cols":["tiv_2016"],"rows":[["70.00"]]},"ordered":false},{"n":43,"id":185,"slug":"department-top-three-salaries","title":"Department Top Three Salaries","sec":"subq","diff":"Hard","concepts":["DENSE_RANK","PARTITION BY","Correlated subquery"],"pattern":"Top-N per group with ties → DENSE_RANK","prompt":"A high earner is an employee whose salary is among the **top three unique salaries** in their department. Return department name, employee name and salary of all high earners.","returns":"Department, Employee, Salary (any order)","approach":["Top-N **per group** → window function with `PARTITION BY departmentId`.","\"Top three unique salaries\" → ties share a rank and don't consume extra ranks → `DENSE_RANK`.","Filter rank ≤ 3 in an outer query (window results can't be used in WHERE directly)."],"remember":["ROW_NUMBER: 1,2,3,4 (no ties) · RANK: 1,2,2,4 (gaps) · DENSE_RANK: 1,2,2,3 (no gaps).","\"Top N unique values\" → DENSE_RANK. \"Top N rows\" → ROW_NUMBER.","Window functions are evaluated after WHERE → filter on them from an outer query or CTE."],"pitfalls":["`LIMIT 3` can't work per department.","RANK cuts people after a tie."],"recall":"DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) ≤ 3, join Department.","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, departmentId INT);\nCREATE TABLE Department (id INT PRIMARY KEY, name VARCHAR(255));\nINSERT INTO Department VALUES (1,'Engineering'),(2,'Sales');\nINSERT INTO Employee VALUES\n(1,'Arjun',95000,1),(2,'Bhavya',88000,2),(3,'Chirag',61000,2),(4,'Dev',110000,1),(5,'Esha',72000,1),\n(6,'Farhan',95000,1),(7,'Gita',80000,1),(8,'Hari',50000,2),(9,'Indu',45000,2);","solution":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary\nFROM (\n  SELECT name, salary, departmentId,\n         DENSE_RANK() OVER (PARTITION BY departmentId ORDER BY salary DESC) AS rnk\n  FROM Employee\n) e\nJOIN Department d ON d.id = e.departmentId\nWHERE e.rnk <= 3;","steps":[{"t":"ROW_NUMBER vs RANK vs DENSE_RANK per department","note":"Arjun and Farhan tie at 95000: RANK jumps 2→4 (so Gita would be cut), DENSE_RANK goes 2→3 (Gita kept). That's exactly why DENSE_RANK.","sql":"SELECT e.departmentId AS _grp, d.name AS department, e.name, e.salary,\n       ROW_NUMBER() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC, e.name) AS `+row_number`,\n       RANK()       OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS `+rank`,\n       DENSE_RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS `+dense_rank`,\n       DENSE_RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) <= 3 AS _keep\nFROM Employee e JOIN Department d ON d.id = e.departmentId\nORDER BY d.name, e.salary DESC, e.name","cols":["_grp","department","name","salary","+row_number","+rank","+dense_rank","_keep"],"rows":[[1,"Engineering","Dev",110000,1,1,1,1],[1,"Engineering","Arjun",95000,2,2,2,1],[1,"Engineering","Farhan",95000,3,2,2,1],[1,"Engineering","Gita",80000,4,4,3,1],[1,"Engineering","Esha",72000,5,5,4,0],[2,"Sales","Bhavya",88000,1,1,1,1],[2,"Sales","Chirag",61000,2,2,2,1],[2,"Sales","Hari",50000,3,3,3,1],[2,"Sales","Indu",45000,4,4,4,0]]}],"alts":[{"label":"Correlated subquery","sql":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary\nFROM Employee e\nJOIN Department d ON d.id = e.departmentId\nWHERE (\n  SELECT COUNT(DISTINCT e2.salary)\n  FROM Employee e2\n  WHERE e2.departmentId = e.departmentId\n    AND e2.salary > e.salary\n) < 3;","note":"\"Fewer than 3 distinct salaries are higher than mine\" ⇔ I'm in the top 3 unique salaries.","verified":true}],"inputs":[{"name":"Employee","cols":["id","name","salary","departmentId"],"rows":[[1,"Arjun",95000,1],[2,"Bhavya",88000,2],[3,"Chirag",61000,2],[4,"Dev",110000,1],[5,"Esha",72000,1],[6,"Farhan",95000,1],[7,"Gita",80000,1],[8,"Hari",50000,2],[9,"Indu",45000,2]]},{"name":"Department","cols":["id","name"],"rows":[[1,"Engineering"],[2,"Sales"]]}],"schema":[{"name":"Employee","cols":[["id","int","PRI"],["name","varchar(255)",""],["salary","int",""],["departmentId","int",""]]},{"name":"Department","cols":[["id","int","PRI"],["name","varchar(255)",""]]}],"output":{"cols":["Department","Employee","Salary"],"rows":[["Engineering","Dev",110000],["Engineering","Arjun",95000],["Engineering","Farhan",95000],["Engineering","Gita",80000],["Sales","Bhavya",88000],["Sales","Chirag",61000],["Sales","Hari",50000]]},"ordered":false},{"n":44,"id":1667,"slug":"fix-names-in-a-table","title":"Fix Names in a Table","sec":"string","diff":"Easy","concepts":["CONCAT","UPPER/LOWER","LEFT","SUBSTRING"],"pattern":"Rebuild a string from transformed pieces","prompt":"Fix every name so only the first character is uppercase and the rest are lowercase. Order by user_id.","returns":"user_id, name (ordered)","approach":["Split the name: first character + the rest.","UPPER the first, LOWER the rest, CONCAT them back."],"remember":["MySQL strings are **1-indexed**: `SUBSTRING(s, 1, 1)` is the first character.","`CONCAT()` returns NULL if any argument is NULL; `CONCAT_WS(sep, …)` skips NULLs."],"pitfalls":["`SUBSTRING(name, 0, 1)` returns an empty string in MySQL (position 0)."],"recall":"CONCAT(UPPER(LEFT(name,1)), LOWER(SUBSTRING(name,2))) ORDER BY user_id.","ordered":true,"setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(40));\nINSERT INTO Users VALUES (1,'aNANYA'),(2,'vIKAS'),(3,'PRIYA'),(4,'z');","solution":"SELECT user_id,\n       CONCAT(UPPER(LEFT(name, 1)), LOWER(SUBSTRING(name, 2))) AS name\nFROM Users\nORDER BY user_id;","steps":[{"t":"Break apart, transform, rebuild","note":"For a one-letter name, SUBSTRING(name, 2) is just '' — no special case needed.","sql":"SELECT user_id, name, LEFT(name, 1) AS first_char, SUBSTRING(name, 2) AS rest,\n       CONCAT(UPPER(LEFT(name, 1)), LOWER(SUBSTRING(name, 2))) AS `+fixed`\nFROM Users ORDER BY user_id","cols":["user_id","name","first_char","rest","+fixed"],"rows":[[1,"aNANYA","a","NANYA","Ananya"],[2,"vIKAS","v","IKAS","Vikas"],[3,"PRIYA","P","RIYA","Priya"],[4,"z","z","","Z"]]}],"alts":[{"label":"SUBSTR everywhere","sql":"SELECT user_id,\n       CONCAT(UPPER(SUBSTR(name, 1, 1)), LOWER(SUBSTR(name, 2))) AS name\nFROM Users\nORDER BY user_id;","note":"`SUBSTR` = `SUBSTRING`; `SUBSTRING(s, pos)` without a length returns the rest of the string.","verified":true}],"inputs":[{"name":"Users","cols":["user_id","name"],"rows":[[1,"aNANYA"],[2,"vIKAS"],[3,"PRIYA"],[4,"z"]]}],"schema":[{"name":"Users","cols":[["user_id","int","PRI"],["name","varchar(40)",""]]}],"output":{"cols":["user_id","name"],"rows":[[1,"Ananya"],[2,"Vikas"],[3,"Priya"],[4,"Z"]]}},{"n":45,"id":1527,"slug":"patients-with-a-condition","title":"Patients With a Condition","sec":"string","diff":"Easy","concepts":["LIKE","REGEXP","Word boundary"],"pattern":"Match a code at the start of a word in a space-separated list","prompt":"`conditions` holds zero or more space-separated codes. Type I Diabetes codes always **start with** `DIAB1`. Return patients who have such a code.","returns":"patient_id, patient_name, conditions (any order)","approach":["The code must start a word: either at the very start of the string, or right after a space.","Two LIKE patterns: `'DIAB1%'` (first code) and `'% DIAB1%'` (any later code)."],"remember":["LIKE wildcards: `%` = any sequence (incl. empty), `_` = exactly one character.","\"Word starts with X\" in a space-separated list: `LIKE 'X%' OR LIKE '% X%'`."],"pitfalls":["`LIKE '%DIAB1%'` matches codes like SADIAB100 — LeetCode tests this."],"recall":"LIKE 'DIAB1%' OR LIKE '% DIAB1%'.","setup":"CREATE TABLE Patients (patient_id INT PRIMARY KEY, patient_name VARCHAR(30), conditions VARCHAR(100));\nINSERT INTO Patients VALUES\n(1,'Anand','FEVR COUGH'),(2,'Bindu',''),(3,'Charu','DIAB100 MYOP'),(4,'Darsh','ACNE DIAB102'),\n(5,'Ekta','DIAB201'),(6,'Faiz','SADIAB100'),(7,'Gauri','DIAB1');","solution":"SELECT patient_id, patient_name, conditions\nFROM Patients\nWHERE conditions LIKE 'DIAB1%'\n   OR conditions LIKE '% DIAB1%';","steps":[{"t":"Naive vs correct patterns","note":"Faiz's 'SADIAB100' contains DIAB1 in the middle of a word — the naive pattern wrongly matches it.","sql":"SELECT patient_id, patient_name, conditions,\n       conditions LIKE '%DIAB1%' AS `+LIKE '%DIAB1%' (naive)`,\n       conditions LIKE 'DIAB1%' AS `+starts with`,\n       conditions LIKE '% DIAB1%' AS `+after a space`,\n       (conditions LIKE 'DIAB1%' OR conditions LIKE '% DIAB1%') AS _keep\nFROM Patients ORDER BY patient_id","cols":["patient_id","patient_name","conditions","+LIKE '%DIAB1%' (naive)","+starts with","+after a space","_keep"],"rows":[[1,"Anand","FEVR COUGH",0,0,0,0],[2,"Bindu","",0,0,0,0],[3,"Charu","DIAB100 MYOP",1,1,0,1],[4,"Darsh","ACNE DIAB102",1,0,1,1],[5,"Ekta","DIAB201",0,0,0,0],[6,"Faiz","SADIAB100",1,0,0,0],[7,"Gauri","DIAB1",1,1,0,1]]}],"alts":[{"label":"REGEXP","sql":"SELECT patient_id, patient_name, conditions\nFROM Patients\nWHERE conditions REGEXP '(^| )DIAB1';","note":"Start of string OR a space, then DIAB1. `'\\\\bDIAB1'` (word boundary) also works in MySQL 8.","verified":true}],"inputs":[{"name":"Patients","cols":["patient_id","patient_name","conditions"],"rows":[[1,"Anand","FEVR COUGH"],[2,"Bindu",""],[3,"Charu","DIAB100 MYOP"],[4,"Darsh","ACNE DIAB102"],[5,"Ekta","DIAB201"],[6,"Faiz","SADIAB100"],[7,"Gauri","DIAB1"]]}],"schema":[{"name":"Patients","cols":[["patient_id","int","PRI"],["patient_name","varchar(30)",""],["conditions","varchar(100)",""]]}],"output":{"cols":["patient_id","patient_name","conditions"],"rows":[[3,"Charu","DIAB100 MYOP"],[4,"Darsh","ACNE DIAB102"],[7,"Gauri","DIAB1"]]},"ordered":false},{"n":46,"id":196,"slug":"delete-duplicate-emails","title":"Delete Duplicate Emails","sec":"string","diff":"Easy","concepts":["DELETE + JOIN","Self join","Error 1093"],"pattern":"Delete every duplicate except the smallest id","prompt":"Write a **DELETE** statement that removes duplicate emails from `Person`, keeping only the row with the smallest id for each email. (LeetCode checks the table afterwards.)","returns":"the Person table after the delete","post":"SELECT * FROM Person ORDER BY id","approach":["A row should go if another row has the **same email and a smaller id**.","Self join expresses exactly that: `p1.email = p2.email AND p1.id > p2.id` → p1 is a later duplicate.","MySQL's multi-table DELETE: `DELETE p1 FROM … JOIN …` deletes only from p1."],"remember":["MySQL DELETE with join: `DELETE alias FROM t alias JOIN …` — name the table(s) to delete from after DELETE.","Error 1093 (\"can't specify target table for update in FROM clause\"): wrap the subquery in another derived table.","To just *find* duplicates: `SELECT email FROM Person GROUP BY email HAVING COUNT(*) > 1`."],"pitfalls":["Using `>=` or `<>` in the join deletes every copy, including the one to keep."],"recall":"DELETE p1 FROM Person p1 JOIN Person p2 ON same email AND p1.id > p2.id.","setup":"CREATE TABLE Person (id INT PRIMARY KEY, email VARCHAR(255));\nINSERT INTO Person VALUES (1,'ravi@mail.com'),(2,'sana@mail.com'),(3,'ravi@mail.com'),(4,'tom@mail.com'),(5,'sana@mail.com'),(6,'ravi@mail.com');","solution":"DELETE p1\nFROM Person p1\nJOIN Person p2\n  ON p1.email = p2.email\n AND p1.id > p2.id;","steps":[{"t":"Which rows have a smaller-id twin?","note":"Row 6 matches two smaller twins (1 and 3) — it is still deleted only once.","sql":"SELECT p1.id AS `p1.id (to delete)`, p1.email, p2.id AS `p2.id (smaller twin)`\nFROM Person p1 JOIN Person p2 ON p1.email = p2.email AND p1.id > p2.id\nORDER BY p1.id, p2.id","cols":["p1.id (to delete)","email","p2.id (smaller twin)"],"rows":[[3,"ravi@mail.com",1],[5,"sana@mail.com",2],[6,"ravi@mail.com",1],[6,"ravi@mail.com",3]]},{"t":"Before → after, grouped by email","note":"In each email group only the smallest id survives.","sql":"SELECT email AS _grp, id, email,\n       id = (SELECT MIN(id) FROM Person x WHERE x.email = p.email) AS _keep\nFROM Person p ORDER BY email, id","cols":["_grp","id","email","_keep"],"rows":[["ravi@mail.com",1,"ravi@mail.com",1],["ravi@mail.com",3,"ravi@mail.com",0],["ravi@mail.com",6,"ravi@mail.com",0],["sana@mail.com",2,"sana@mail.com",1],["sana@mail.com",5,"sana@mail.com",0],["tom@mail.com",4,"tom@mail.com",1]]}],"alts":[{"label":"NOT IN with a derived-table wrapper","sql":"DELETE FROM Person\nWHERE id NOT IN (\n  SELECT id FROM (\n    SELECT MIN(id) AS id FROM Person GROUP BY email\n  ) AS keep_ids\n);","note":"The extra derived table is required: MySQL won't let you DELETE from a table and select from it in a direct subquery (error 1093).","verified":true},{"label":"ROW_NUMBER","sql":"DELETE FROM Person\nWHERE id IN (\n  SELECT id FROM (\n    SELECT id, ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn\n    FROM Person\n  ) t\n  WHERE rn > 1\n);","note":"Number each email's rows by id; delete everything after the first.","verified":true}],"inputs":[{"name":"Person","cols":["id","email"],"rows":[[1,"ravi@mail.com"],[2,"sana@mail.com"],[3,"ravi@mail.com"],[4,"tom@mail.com"],[5,"sana@mail.com"],[6,"ravi@mail.com"]]}],"schema":[{"name":"Person","cols":[["id","int","PRI"],["email","varchar(255)",""]]}],"output":{"cols":["id","email"],"rows":[[1,"ravi@mail.com"],[2,"sana@mail.com"],[4,"tom@mail.com"]]},"ordered":false},{"n":47,"id":176,"slug":"second-highest-salary","title":"Second Highest Salary","sec":"string","diff":"Medium","concepts":["LIMIT OFFSET","DISTINCT","Scalar subquery","NULL on empty"],"pattern":"Nth distinct value — and NULL when it doesn't exist","prompt":"Return the second highest **distinct** salary from `Employee`, or NULL if there isn't one.","returns":"SecondHighestSalary (one row, possibly NULL)","approach":["Distinct salaries sorted descending; skip one, take one → `DISTINCT … ORDER BY … LIMIT 1 OFFSET 1`.","If there's no second salary, that query returns **no rows** — but we need one NULL row.","Wrap it as a scalar subquery: an empty scalar subquery evaluates to NULL."],"remember":["`LIMIT n OFFSET m` = skip m rows, take n (also written `LIMIT m, n`).","Scalar subquery with no row → NULL. Plain query with no row → empty result.","Nth highest (LC 177): `LIMIT 1 OFFSET N-1` (compute N-1 into a variable first inside a function)."],"pitfalls":["Forgetting DISTINCT.","Returning an empty result instead of NULL when there's only one salary."],"recall":"SELECT (SELECT DISTINCT salary ORDER BY salary DESC LIMIT 1 OFFSET 1).","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1,70000),(2,90000),(3,90000),(4,50000);","solution":"SELECT (\n  SELECT DISTINCT salary\n  FROM Employee\n  ORDER BY salary DESC\n  LIMIT 1 OFFSET 1\n) AS SecondHighestSalary;","steps":[{"t":"Rank the salaries","note":"90000 appears twice. By position, row 2 is still 90000 — by distinct rank, #2 is 70000.","sql":"SELECT id, salary,\n       ROW_NUMBER() OVER (ORDER BY salary DESC, id) AS `+position`,\n       DENSE_RANK() OVER (ORDER BY salary DESC) AS `+dense_rank`,\n       DENSE_RANK() OVER (ORDER BY salary DESC) = 2 AS _keep\nFROM Employee ORDER BY salary DESC, id","cols":["id","salary","+position","+dense_rank","_keep"],"rows":[[2,90000,1,1,0],[3,90000,2,1,0],[1,70000,3,2,1],[4,50000,4,3,0]]},{"t":"Trap: OFFSET without DISTINCT","note":"Returns 90000 — the duplicate top salary. DISTINCT is essential.","sql":"SELECT salary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET 1","cols":["salary"],"rows":[[90000]]}],"alts":[{"label":"MAX below the MAX","sql":"SELECT MAX(salary) AS SecondHighestSalary\nFROM Employee\nWHERE salary < (SELECT MAX(salary) FROM Employee);","note":"MAX over an empty set is NULL — the NULL case comes for free.","verified":true},{"label":"DENSE_RANK","sql":"SELECT MAX(salary) AS SecondHighestSalary\nFROM (\n  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk\n  FROM Employee\n) t\nWHERE rnk = 2;","note":"Generalises to the Nth highest; the outer MAX guarantees one row (NULL if none).","verified":true}],"inputs":[{"name":"Employee","cols":["id","salary"],"rows":[[1,70000],[2,90000],[3,90000],[4,50000]]}],"schema":[{"name":"Employee","cols":[["id","int","PRI"],["salary","int",""]]}],"output":{"cols":["SecondHighestSalary"],"rows":[[70000]]},"ordered":false},{"n":48,"id":1484,"slug":"group-sold-products-by-the-date","title":"Group Sold Products By The Date","sec":"string","diff":"Easy","concepts":["GROUP_CONCAT","COUNT(DISTINCT)","ORDER BY"],"pattern":"Aggregate strings into a list per group","prompt":"For each sell_date, report the number of **different** products sold and their names sorted alphabetically, joined by commas. Order by sell_date.","returns":"sell_date, num_sold, products (ordered)","approach":["One row per date → GROUP BY sell_date.","Duplicates exist → DISTINCT in both the count and the list.","`GROUP_CONCAT(DISTINCT x ORDER BY x SEPARATOR ',')` builds the sorted list."],"remember":["`GROUP_CONCAT(DISTINCT col ORDER BY col SEPARATOR ',')` — default separator is ','.","Result is cut at `group_concat_max_len` (1024 bytes by default).","PostgreSQL / SQL Server equivalent: `STRING_AGG(col, ',')`."],"pitfalls":["Forgetting DISTINCT inside GROUP_CONCAT lists duplicates."],"recall":"GROUP BY date; COUNT(DISTINCT product); GROUP_CONCAT(DISTINCT product ORDER BY product).","ordered":true,"setup":"CREATE TABLE Activities (sell_date DATE, product VARCHAR(20));\nINSERT INTO Activities VALUES\n('2024-05-30','Pen'),('2024-06-01','Notebook'),('2024-06-02','Mask'),('2024-05-30','Bat'),\n('2024-06-01','Atlas'),('2024-06-02','Mask'),('2024-05-30','Tiffin'),('2024-05-30','Bat');","solution":"SELECT sell_date,\n       COUNT(DISTINCT product) AS num_sold,\n       GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',') AS products\nFROM Activities\nGROUP BY sell_date\nORDER BY sell_date;","steps":[{"t":"Rows per date","note":"30 May sold Bat twice → counted and listed once.","sql":"SELECT sell_date AS _grp, sell_date, product FROM Activities ORDER BY sell_date, product","cols":["_grp","sell_date","product"],"rows":[["2024-05-30","2024-05-30","Bat"],["2024-05-30","2024-05-30","Bat"],["2024-05-30","2024-05-30","Pen"],["2024-05-30","2024-05-30","Tiffin"],["2024-06-01","2024-06-01","Atlas"],["2024-06-01","2024-06-01","Notebook"],["2024-06-02","2024-06-02","Mask"],["2024-06-02","2024-06-02","Mask"]]}],"alts":[],"inputs":[{"name":"Activities","cols":["sell_date","product"],"rows":[["2024-05-30","Pen"],["2024-06-01","Notebook"],["2024-06-02","Mask"],["2024-05-30","Bat"],["2024-06-01","Atlas"],["2024-06-02","Mask"],["2024-05-30","Tiffin"],["2024-05-30","Bat"]]}],"schema":[{"name":"Activities","cols":[["sell_date","date",""],["product","varchar(20)",""]]}],"output":{"cols":["sell_date","num_sold","products"],"rows":[["2024-05-30",3,"Bat,Pen,Tiffin"],["2024-06-01",2,"Atlas,Notebook"],["2024-06-02",1,"Mask"]]}},{"n":49,"id":1327,"slug":"list-the-products-ordered-in-a-period","title":"List the Products Ordered in a Period","sec":"string","diff":"Easy","concepts":["JOIN","Date range","HAVING SUM"],"pattern":"Filter a month, aggregate, then filter groups","prompt":"Return the names of products with **at least 100** units ordered in **February 2020**, and that amount.","returns":"product_name, unit (any order)","approach":["Row filter: February 2020 (WHERE).","Group per product and SUM units.","Group filter: total ≥ 100 (HAVING)."],"remember":["Half-open ranges `>= start AND < next_start` are the safest date filters (no end-of-month or time-of-day bugs).","WHERE filters rows before grouping; HAVING filters the sums after."],"pitfalls":["Ending the range at '2020-02-28'.","Putting `SUM(unit) >= 100` in WHERE (invalid)."],"recall":"WHERE Feb-2020 range, GROUP BY product, HAVING SUM(unit) >= 100.","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, product_name VARCHAR(40), product_category VARCHAR(40));\nCREATE TABLE Orders (product_id INT, order_date DATE, unit INT);\nINSERT INTO Products VALUES (1,'Laptop','Computer'),(2,'Kurta','Clothing'),(3,'Mixer','Kitchen'),(4,'Kindle','Book');\nINSERT INTO Orders VALUES\n(1,'2020-02-05',60),(1,'2020-02-10',70),(2,'2020-01-18',30),(2,'2020-02-11',80),(2,'2020-02-29',20),\n(3,'2020-02-17',50),(3,'2020-03-01',90),(4,'2020-02-09',100),(4,'2020-01-31',50);","solution":"SELECT p.product_name, SUM(o.unit) AS unit\nFROM Orders o\nJOIN Products p ON p.product_id = o.product_id\nWHERE o.order_date >= '2020-02-01'\n  AND o.order_date <  '2020-03-01'\nGROUP BY p.product_id, p.product_name\nHAVING SUM(o.unit) >= 100;","steps":[{"t":"Keep February 2020 orders","note":"29 Feb is in (2020 is a leap year); 1 Mar and January orders are out.","sql":"SELECT o.product_id AS _grp, p.product_name, o.order_date, o.unit,\n       (o.order_date >= '2020-02-01' AND o.order_date < '2020-03-01') AS _keep\nFROM Orders o JOIN Products p ON p.product_id = o.product_id\nORDER BY o.product_id, o.order_date","cols":["_grp","product_name","order_date","unit","_keep"],"rows":[[1,"Laptop","2020-02-05",60,1],[1,"Laptop","2020-02-10",70,1],[2,"Kurta","2020-01-18",30,0],[2,"Kurta","2020-02-11",80,1],[2,"Kurta","2020-02-29",20,1],[3,"Mixer","2020-02-17",50,1],[3,"Mixer","2020-03-01",90,0],[4,"Kindle","2020-01-31",50,0],[4,"Kindle","2020-02-09",100,1]]},{"t":"Sum per product, keep totals ≥ 100","note":"Kurta hits exactly 100 — included (at least).","sql":"SELECT p.product_name, SUM(o.unit) AS `+feb_units`, SUM(o.unit) >= 100 AS _keep\nFROM Orders o JOIN Products p ON p.product_id = o.product_id\nWHERE o.order_date >= '2020-02-01' AND o.order_date < '2020-03-01'\nGROUP BY p.product_id, p.product_name ORDER BY p.product_id","cols":["product_name","+feb_units","_keep"],"rows":[["Laptop","130",1],["Kurta","100",1],["Mixer","50",0],["Kindle","100",1]]}],"alts":[{"label":"DATE_FORMAT filter","sql":"SELECT p.product_name, SUM(o.unit) AS unit\nFROM Orders o\nJOIN Products p USING (product_id)\nWHERE DATE_FORMAT(o.order_date, '%Y-%m') = '2020-02'\nGROUP BY p.product_id, p.product_name\nHAVING unit >= 100;","note":"Readable, but wrapping the column in a function prevents index use. MySQL lets HAVING use the alias.","verified":true}],"inputs":[{"name":"Products","cols":["product_id","product_name","product_category"],"rows":[[1,"Laptop","Computer"],[2,"Kurta","Clothing"],[3,"Mixer","Kitchen"],[4,"Kindle","Book"]]},{"name":"Orders","cols":["product_id","order_date","unit"],"rows":[[1,"2020-02-05",60],[1,"2020-02-10",70],[2,"2020-01-18",30],[2,"2020-02-11",80],[2,"2020-02-29",20],[3,"2020-02-17",50],[3,"2020-03-01",90],[4,"2020-02-09",100],[4,"2020-01-31",50]]}],"schema":[{"name":"Products","cols":[["product_id","int","PRI"],["product_name","varchar(40)",""],["product_category","varchar(40)",""]]},{"name":"Orders","cols":[["product_id","int",""],["order_date","date",""],["unit","int",""]]}],"output":{"cols":["product_name","unit"],"rows":[["Laptop","130"],["Kurta","100"],["Kindle","100"]]},"ordered":false},{"n":50,"id":1517,"slug":"find-users-with-valid-e-mails","title":"Find Users With Valid E-Mails","sec":"string","diff":"Easy","concepts":["REGEXP_LIKE","Anchors","Case sensitivity"],"pattern":"Validate a whole string with an anchored regex","prompt":"A valid email has a prefix that **starts with a letter** and contains only letters, digits, `_`, `.` or `-`, followed by exactly the domain `@leetcode.com`. Return users with valid emails.","returns":"user_id, name, mail (any order)","approach":["Anchor the whole string: `^ … $`.","First char a letter `[A-Za-z]`, then any of `[A-Za-z0-9_.-]*`, then the literal `@leetcode.com`.","Escape the dot (or use `[.]`) and make the match case-sensitive."],"remember":["MySQL `REGEXP` follows the column collation — usually **case-insensitive**. Use `REGEXP_LIKE(s, pat, 'c')` or `BINARY` for exact case.","Inside a MySQL string literal, regex backslashes are doubled: `'\\\\.'`. `[.]` sidesteps the escaping.","In a character class, put `-` last (or first) so it's literal."],"pitfalls":["Unanchored pattern matches emails with junk before/after.","Unescaped `.` matches any character."],"recall":"REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$', 'c').","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(30), mail VARCHAR(50));\nINSERT INTO Users VALUES\n(1,'Aarav','aarav.k@leetcode.com'),(2,'Bhumi','bhumi-99@leetcode.com'),(3,'Chris','_chris@leetcode.com'),\n(4,'Diya','diya@leetcode.co'),(5,'Eva','eva#1@leetcode.com'),(6,'Farid','Farid_X@leetcode.com'),\n(7,'Gina','gina@LEETCODE.COM'),(8,'Hrithik','hrithik@leetcodeXcom'),(9,'Ishan','9ishan@leetcode.com');","solution":"SELECT *\nFROM Users\nWHERE REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$', 'c');","steps":[{"t":"Why both escaping and case-sensitivity matter","note":"Gina's '@LEETCODE.COM' passes a default REGEXP (MySQL's default collation is case-insensitive). Hrithik's 'leetcodeXcom' passes when the dot is unescaped (. = any char).","sql":"SELECT user_id, mail,\n       mail REGEXP '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$' AS `+default (case-insensitive)`,\n       REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode.com$', 'c') AS `+unescaped dot`,\n       REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$', 'c') AS _keep\nFROM Users ORDER BY user_id","cols":["user_id","mail","+default (case-insensitive)","+unescaped dot","_keep"],"rows":[[1,"aarav.k@leetcode.com",1,1,1],[2,"bhumi-99@leetcode.com",1,1,1],[3,"_chris@leetcode.com",0,0,0],[4,"diya@leetcode.co",0,0,0],[5,"eva#1@leetcode.com",0,0,0],[6,"Farid_X@leetcode.com",1,1,1],[7,"gina@LEETCODE.COM",1,0,0],[8,"hrithik@leetcodeXcom",0,1,0],[9,"9ishan@leetcode.com",0,0,0]]}],"alts":[{"label":"Case-sensitive collation","sql":"SELECT *\nFROM Users\nWHERE mail COLLATE utf8mb4_bin REGEXP '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\\\.com$';","note":"A `_bin` collation makes REGEXP case-sensitive. Inside a MySQL string, a literal dot is written `\\\\.` (or `[.]`). Older answers use `REGEXP BINARY`, which throws error 3995 on MySQL 8 with utf8mb4 columns.","verified":true}],"inputs":[{"name":"Users","cols":["user_id","name","mail"],"rows":[[1,"Aarav","aarav.k@leetcode.com"],[2,"Bhumi","bhumi-99@leetcode.com"],[3,"Chris","_chris@leetcode.com"],[4,"Diya","diya@leetcode.co"],[5,"Eva","eva#1@leetcode.com"],[6,"Farid","Farid_X@leetcode.com"],[7,"Gina","gina@LEETCODE.COM"],[8,"Hrithik","hrithik@leetcodeXcom"],[9,"Ishan","9ishan@leetcode.com"]]}],"schema":[{"name":"Users","cols":[["user_id","int","PRI"],["name","varchar(30)",""],["mail","varchar(50)",""]]}],"output":{"cols":["user_id","name","mail"],"rows":[[1,"Aarav","aarav.k@leetcode.com"],[2,"Bhumi","bhumi-99@leetcode.com"],[6,"Farid","Farid_X@leetcode.com"]]},"ordered":false}];
const R = {"sections":[{"key":"select","name":"Select","blurb":"Row filters, NULL logic and string length."},{"key":"joins","name":"Basic Joins","blurb":"INNER vs LEFT, anti-joins, self joins, the CROSS JOIN grid."},{"key":"agg","name":"Basic Aggregate Functions","blurb":"AVG, conditional aggregation, rates and percentages."},{"key":"sortgroup","name":"Sorting and Grouping","blurb":"GROUP BY, HAVING, COUNT(DISTINCT), NULL-on-empty."},{"key":"advjoin","name":"Advanced Select and Joins","blurb":"CASE, LAG/LEAD, running totals, forcing categories."},{"key":"subq","name":"Subqueries","blurb":"NOT IN, scalar subqueries, UNION ALL, window frames, DENSE_RANK."},{"key":"string","name":"Advanced String Functions / Regex / Clause","blurb":"String builders, LIKE vs REGEXP, DELETE, GROUP_CONCAT."}],"patterns":[{"name":"Row filter with nullable columns","when":"Keep rows by conditions where a column can be NULL.","code":"WHERE col <> 2 OR col IS NULL      -- NULL <> 2 is UNKNOWN\nWHERE IFNULL(col, 0) <> 2\nWHERE NOT (col <=> 2)              -- null-safe equality","ids":[1757,584,595,620,577]},{"name":"Anti-join: A without a match in B","when":"\"Customers who never…\", \"visits without transactions\", \"manager left\".","code":"SELECT a.*\nFROM A a\nLEFT JOIN B b ON b.a_id = a.id\nWHERE b.id IS NULL;\n-- or: WHERE NOT EXISTS (SELECT 1 FROM B b WHERE b.a_id = a.id)","ids":[1581,1978,1378]},{"name":"Self join: compare rows of one table","when":"Yesterday vs today, start vs end, manager vs report, later duplicate vs earlier.","code":"SELECT ...\nFROM T a\nJOIN T b\n  ON b.manager_id = a.id                       -- hierarchy\n  -- ON DATEDIFF(a.day, b.day) = 1             -- previous day\n  -- ON a.k = b.k AND a.type='start' AND b.type='end'","ids":[197,1661,570,1731,196]},{"name":"Every combination, zeros included","when":"\"For each student and each subject…\" — output must contain combos with no data.","code":"SELECT s.id, sub.name, COUNT(e.id) AS cnt\nFROM Students s\nCROSS JOIN Subjects sub\nLEFT JOIN Exams e ON e.student_id = s.id AND e.subject = sub.name\nGROUP BY s.id, sub.name;","ids":[1280]},{"name":"Conditional aggregation and rates","when":"Several metrics per group in one pass; \"rate\", \"percentage\", \"approved count\".","code":"SUM(state = 'approved')               -- count where true\nSUM(IF(state = 'approved', amount, 0)) -- total where true\nROUND(AVG(rating < 3) * 100, 2)        -- percentage where true\nROUND(AVG(IF(action='confirmed',1,0)), 2)  -- rate, NULL-safe","ids":[1934,1211,1193,1174,1633,550]},{"name":"Filter groups with HAVING","when":"Conditions on COUNT/SUM/AVG of a group.","code":"SELECT class\nFROM Courses\nGROUP BY class\nHAVING COUNT(*) >= 5;","ids":[570,596,1045,619,1327]},{"name":"First / latest row per group","when":"\"First order\", \"first year\", \"price as of a date\".","code":"WHERE (g, d) IN (SELECT g, MIN(d) FROM T GROUP BY g)\n-- window version:\nROW_NUMBER() OVER (PARTITION BY g ORDER BY d) = 1   -- exactly one row\nRANK()       OVER (PARTITION BY g ORDER BY d) = 1   -- keep ties","ids":[1070,1174,550,1164]},{"name":"Top-N per group","when":"\"Top 3 salaries per department\" — ties share a place.","code":"SELECT * FROM (\n  SELECT e.*, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk\n  FROM Employee e\n) t\nWHERE rnk <= 3;","ids":[185,176]},{"name":"One row even when nothing matches","when":"\"Return NULL if there is no such value.\"","code":"SELECT (SELECT ... ORDER BY x DESC LIMIT 1 OFFSET 1) AS answer;  -- scalar subquery → NULL\nSELECT MAX(x) AS answer FROM (...) t;                            -- MAX of empty set → NULL","ids":[176,619]},{"name":"Relational division (\"has ALL of\")","when":"\"Customers who bought every product\".","code":"SELECT customer_id\nFROM Customer\nGROUP BY customer_id\nHAVING COUNT(DISTINCT product_key) = (SELECT COUNT(*) FROM Product);","ids":[1045]},{"name":"Running and moving totals","when":"\"Cumulative weight\", \"7-day moving average\".","code":"SUM(w) OVER (ORDER BY turn)                                   -- running total\nSUM(a) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) -- last 7 rows\nSUM(a) OVER (ORDER BY d RANGE BETWEEN INTERVAL 6 DAY PRECEDING AND CURRENT ROW)","ids":[1204,1321]},{"name":"Neighbouring rows","when":"\"Three in a row\", \"swap adjacent\", \"compared with previous\".","code":"LAG(col)  OVER (ORDER BY id)   -- previous row's value\nLEAD(col) OVER (ORDER BY id)   -- next row's value\nLAG(col, 2, 0) OVER (...)      -- two back, default 0","ids":[180,197,626]},{"name":"Stack columns or force fixed rows: UNION ALL","when":"Symmetric pairs (friends), fixed category lists, two answers in one column.","code":"SELECT requester_id AS id FROM R\nUNION ALL\nSELECT accepter_id FROM R;        -- unpivot both columns\n\nSELECT 'Low' AS cat, SUM(x < 10) FROM T\nUNION ALL SELECT 'High', SUM(x >= 10) FROM T;","ids":[602,1907,1341,595]},{"name":"Strings and regex","when":"Clean, measure, match or aggregate text.","code":"CONCAT(UPPER(LEFT(s,1)), LOWER(SUBSTRING(s,2)))\nCHAR_LENGTH(s)                            -- characters (LENGTH = bytes)\ns LIKE 'X%' OR s LIKE '% X%'              -- word starts with X\nREGEXP_LIKE(s, '^[a-z]+$', 'c')           -- case-sensitive regex\nGROUP_CONCAT(DISTINCT x ORDER BY x SEPARATOR ',')","ids":[1667,1527,1517,1484,1683]},{"name":"Date windows","when":"Month filters, N-day periods, day-after checks.","code":"d >= '2020-02-01' AND d < '2020-03-01'     -- a month, half-open\nd BETWEEN '2019-06-28' AND '2019-07-27'    -- 30 days ending 27 Jul\nDATE_FORMAT(d, '%Y-%m')                    -- '2025-01'\nDATE_ADD(d, INTERVAL 1 DAY), DATEDIFF(a, b) -- a - b in days","ids":[1141,1193,1327,1341,197,550]},{"name":"Delete duplicates, keep one","when":"\"Keep the row with the smallest id per email\".","code":"DELETE p1\nFROM Person p1\nJOIN Person p2 ON p1.email = p2.email AND p1.id > p2.id;","ids":[196]}],"cheatsheet":[{"group":"NULL handling","rows":[["col IS NULL / IS NOT NULL","The only correct NULL test","WHERE referee_id IS NULL"],["IFNULL(a, b)","b when a is NULL (2 args)","IFNULL(bonus, 0)"],["COALESCE(a, b, c…)","First non-NULL argument","COALESCE(nick, name, 'n/a')"],["NULLIF(a, b)","NULL when a = b — avoids divide-by-zero","x / NULLIF(y, 0)"],["a <=> b","Null-safe equality: NULL <=> NULL is 1","NOT (referee_id <=> 2)"]]},{"group":"Conditionals","rows":[["CASE WHEN … THEN … ELSE … END","First TRUE branch wins","CASE WHEN x<20000 THEN 'Low' … END"],["IF(cond, a, b)","MySQL two-way shortcut","IF(state='approved', amount, 0)"],["cond (bare)","Comparisons return 1 / 0 / NULL","SUM(rating < 3)"]]},{"group":"Aggregates","rows":[["COUNT(*) · COUNT(col)","All rows · non-NULL values","COUNT(e.subject_name)"],["COUNT(DISTINCT col)","Unique non-NULL values","COUNT(DISTINCT user_id)"],["SUM / AVG / MIN / MAX","Ignore NULLs; empty input → NULL","ROUND(AVG(x), 2)"],["GROUP_CONCAT(…)","Join strings per group","GROUP_CONCAT(DISTINCT p ORDER BY p SEPARATOR ',')"]]},{"group":"Window functions","rows":[["ROW_NUMBER()","1,2,3,4 — unique positions","ROW_NUMBER() OVER (PARTITION BY g ORDER BY d)"],["RANK()","1,2,2,4 — ties share, gaps after","RANK() OVER (ORDER BY score DESC)"],["DENSE_RANK()","1,2,2,3 — ties share, no gaps","DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC)"],["LAG / LEAD(col, n, default)","Value n rows before / after","LAG(temperature) OVER (ORDER BY recordDate)"],["SUM(x) OVER (ORDER BY k)","Running total","SUM(weight) OVER (ORDER BY turn)"],["ROWS BETWEEN n PRECEDING AND CURRENT ROW","Moving window by row count","AVG(a) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)"],["COUNT(*) OVER (PARTITION BY g)","Group size on every row","COUNT(*) OVER (PARTITION BY lat, lon)"]]},{"group":"Dates","rows":[["DATEDIFF(a, b)","a − b in days","DATEDIFF('2019-07-27', d)"],["TIMESTAMPDIFF(unit, a, b)","b − a in unit (note the order flips)","TIMESTAMPDIFF(MONTH, start, end)"],["DATE_ADD / DATE_SUB(d, INTERVAL n unit)","Shift a date","DATE_ADD(first_login, INTERVAL 1 DAY)"],["DATE_FORMAT(d, fmt)","%Y year, %m month, %d day, %H hour, %i minute","DATE_FORMAT(d, '%Y-%m')"],["YEAR(d) · MONTH(d) · LAST_DAY(d)","Parts and month end","LAST_DAY('2020-02-10') = 2020-02-29"]]},{"group":"Strings","rows":[["CONCAT(a, b) · CONCAT_WS(sep, …)","CONCAT is NULL if any arg is NULL; CONCAT_WS skips NULLs","CONCAT(first, ' ', last)"],["UPPER · LOWER · TRIM · REPLACE","Case, whitespace, substitution","REPLACE(phone, '-', '')"],["LEFT(s, n) · RIGHT(s, n) · SUBSTRING(s, pos, len)","1-indexed","SUBSTRING(name, 2)"],["CHAR_LENGTH(s) · LENGTH(s)","Characters · bytes","CHAR_LENGTH(content) > 15"],["LOCATE(sub, s) · INSTR(s, sub)","Position of substring (0 if absent)","LOCATE('@', mail)"],["LIKE: % any run, _ one char","Case-insensitive under default collation","LIKE '% DIAB1%'"],["REGEXP_LIKE(s, pat, 'c')","Regex; 'c' = case-sensitive","REGEXP_LIKE(mail, '^[A-Za-z]', 'c')"]]},{"group":"Numbers and paging","rows":[["ROUND(x, d) · TRUNCATE(x, d)","Round · cut off","ROUND(0.625, 2) = 0.63"],["a / b · a DIV b · a % b","Decimal division · integer division · remainder","7 DIV 2 = 3"],["CEIL · FLOOR · ABS","Integer bounds, absolute value","CEIL(4.1) = 5"],["CAST(x AS DECIMAL(10,2))","Explicit type conversion","CAST(price AS SIGNED)"],["LIMIT n OFFSET m · LIMIT m, n","Skip m, take n","LIMIT 1 OFFSET 1"]]}],"concepts":[{"q":"WHERE vs HAVING?","a":"`WHERE` filters individual rows **before** grouping and can't use aggregates. `HAVING` filters groups **after** GROUP BY and can use `COUNT()`, `SUM()` etc. Put plain row conditions in WHERE — it shrinks the data before the expensive grouping."},{"q":"ROW_NUMBER vs RANK vs DENSE_RANK?","a":"For salaries 100, 90, 90, 80: ROW_NUMBER → 1, 2, 3, 4; RANK → 1, 2, 2, 4; DENSE_RANK → 1, 2, 2, 3. Use DENSE_RANK for \"top N distinct values\", ROW_NUMBER for \"exactly one row per group\"."},{"q":"Which joins exist, and how do you get a FULL OUTER JOIN in MySQL?","a":"INNER (matches only), LEFT / RIGHT (keep all rows of one side, NULLs for the other), CROSS (every combination), self join (a table joined to itself). MySQL has no FULL OUTER JOIN: write `A LEFT JOIN B … UNION A RIGHT JOIN B …` (UNION removes the duplicated matched rows)."},{"q":"UNION vs UNION ALL?","a":"UNION removes duplicate rows (extra sort/hash step); UNION ALL keeps every row and is faster. Default to UNION ALL unless you need de-duplication — it's also the correct choice when two answers can be equal (LC 1341) or when stacking ids to count (LC 602)."},{"q":"COUNT(*) vs COUNT(1) vs COUNT(col) vs COUNT(DISTINCT col)?","a":"COUNT(*) and COUNT(1) both count rows (same performance in MySQL). COUNT(col) counts non-NULL values of col. COUNT(DISTINCT col) counts unique non-NULL values. After a LEFT JOIN, count a right-table column to get 0 for unmatched rows."},{"q":"How does NULL behave?","a":"Any comparison with NULL is UNKNOWN (so `= NULL` never matches — use IS NULL). Aggregates skip NULLs; COUNT(*) does not. GROUP BY puts all NULLs in one group. In MySQL, NULLs sort **first** in ASC order. Arithmetic with NULL gives NULL."},{"q":"Why is NOT IN dangerous?","a":"`x NOT IN (1, 2, NULL)` expands to `x<>1 AND x<>2 AND x<>NULL`; the last part is UNKNOWN, so the whole condition is never TRUE and the query returns nothing. If the subquery column can be NULL, use NOT EXISTS or a LEFT JOIN … IS NULL anti-join."},{"q":"IN vs EXISTS?","a":"IN compares a value with a list/subquery result; EXISTS checks whether a correlated subquery returns any row and stops at the first match. Modern MySQL often rewrites both into semi-joins, so performance is similar; the real difference is NULL behaviour with the NOT forms."},{"q":"Correlated vs non-correlated subquery?","a":"A non-correlated subquery runs on its own once (e.g. `SELECT MAX(salary) FROM Employee`). A correlated subquery references the outer row (`WHERE e2.dept = e.dept`) and logically runs once per outer row — fine on small data, but a window function or join is usually faster."},{"q":"CTE vs subquery vs temporary table?","a":"A CTE (`WITH x AS (…)`) is a named subquery for one statement — more readable, can be referenced several times, and can be RECURSIVE (hierarchies, number series). A derived table is the inline form. A temporary table persists for the session and can be indexed — useful for heavy multi-step work."},{"q":"Window function vs GROUP BY?","a":"GROUP BY collapses each group to one row. A window function computes over a group (PARTITION BY) but keeps every row, so you can show the row and its group's metric side by side (rank, running total, group size)."},{"q":"What is the logical order of execution — and why can't I use a SELECT alias in WHERE?","a":"FROM/JOIN → WHERE → GROUP BY → HAVING → window functions → SELECT → DISTINCT → ORDER BY → LIMIT. Aliases are created in SELECT, after WHERE runs. MySQL does allow aliases in GROUP BY, HAVING and ORDER BY as an extension. Window results can only be filtered from an outer query."},{"q":"DELETE vs TRUNCATE vs DROP?","a":"DELETE removes chosen rows (WHERE), is logged row by row, fires triggers and can be rolled back. TRUNCATE removes all rows fast, resets AUTO_INCREMENT, and is DDL (implicit commit in MySQL). DROP removes the table itself, structure included."},{"q":"Primary key vs unique key vs foreign key?","a":"Primary key: unique, NOT NULL, one per table; in InnoDB it is the clustered index. Unique key: unique values but allows NULLs (multiple), many per table. Foreign key: references another table's key to enforce referential integrity (with ON DELETE/UPDATE actions)."},{"q":"Clustered vs secondary index (InnoDB)?","a":"The clustered index is the table itself, stored in primary-key order. A secondary index stores the indexed columns plus the primary key; a lookup that needs other columns goes back to the clustered index. A covering index contains every column the query needs, so that second lookup is skipped."},{"q":"When will MySQL not use an index?","a":"Function or arithmetic on the indexed column (`YEAR(d) = 2020`, `DATE_FORMAT(d…)`), leading wildcard (`LIKE '%x'`), implicit type conversion, not using the leftmost column of a composite index, OR across different columns, or when the optimizer estimates a full scan is cheaper (low selectivity). Rewrite as a range: `d >= '2020-01-01' AND d < '2021-01-01'`."},{"q":"Composite index — the leftmost-prefix rule?","a":"An index on (a, b, c) can serve filters on a, on a+b, and on a+b+c, but not on b alone or c alone. Equality columns first, then the range column; a range on a column stops the use of later columns for seeking."},{"q":"How do you read EXPLAIN?","a":"Check `type` (ALL = full table scan; ref/eq_ref/range are good), `key` (index actually used), `rows` (estimated rows examined) and `Extra` (\"Using filesort\" / \"Using temporary\" signal extra work; \"Using index\" means covering index). MySQL 8 also has EXPLAIN ANALYZE with real timings."},{"q":"Normalization in one breath?","a":"1NF: atomic values, no repeating groups. 2NF: no non-key column depends on only part of a composite key. 3NF: no non-key column depends on another non-key column. Normalize to avoid update anomalies; denormalize deliberately for read-heavy reporting."},{"q":"ACID and isolation levels?","a":"Atomicity, Consistency, Isolation, Durability. Isolation levels: READ UNCOMMITTED (dirty reads), READ COMMITTED, REPEATABLE READ (InnoDB default), SERIALIZABLE. Anomalies to name: dirty read, non-repeatable read, phantom read."},{"q":"CHAR vs VARCHAR, DECIMAL vs FLOAT?","a":"CHAR(n) is fixed length (padded), good for fixed codes; VARCHAR(n) is variable length. DECIMAL is exact — use it for money; FLOAT/DOUBLE are approximate binary floats (0.1 + 0.2 ≠ 0.3)."},{"q":"How do you find and remove duplicates?","a":"Find: `SELECT email, COUNT(*) FROM T GROUP BY email HAVING COUNT(*) > 1`. Remove keeping the smallest id: `DELETE t1 FROM T t1 JOIN T t2 ON t1.email = t2.email AND t1.id > t2.id`, or delete rows with `ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) > 1` via a derived table."},{"q":"Nth highest salary — three ways?","a":"(1) `SELECT DISTINCT salary … ORDER BY salary DESC LIMIT 1 OFFSET N-1`, wrapped in a scalar subquery for NULL. (2) `DENSE_RANK() OVER (ORDER BY salary DESC) = N` with an outer MAX. (3) Correlated: salary where `COUNT(DISTINCT higher salaries) = N-1`."},{"q":"How do you pivot rows into columns?","a":"Conditional aggregation: `SELECT id, SUM(CASE WHEN month='Jan' THEN revenue END) AS jan, SUM(CASE WHEN month='Feb' THEN revenue END) AS feb FROM T GROUP BY id`. MySQL has no PIVOT keyword. Unpivot with UNION ALL."},{"q":"What does ONLY_FULL_GROUP_BY do?","a":"With it on (MySQL 8 default), every SELECT column must be aggregated or functionally dependent on the GROUP BY columns. It stops queries like `SELECT dept, name, MAX(salary) … GROUP BY dept` that would otherwise return an arbitrary name — not the one with the max salary."},{"q":"Default window frame gotcha?","a":"With ORDER BY and no frame, the frame is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`: rows with equal ORDER BY values are included together, and LAST_VALUE returns the current row's peer, not the partition's last. Specify `ROWS BETWEEN …` (or UNBOUNDED FOLLOWING for LAST_VALUE) explicitly."},{"q":"Integer division and rounding in MySQL?","a":"In MySQL `/` returns a decimal (5/2 = 2.5000); use DIV for integer division. In PostgreSQL / SQL Server, int/int truncates — cast first. ROUND on exact DECIMAL values rounds half away from zero (2.5 → 3)."},{"q":"View vs materialized view?","a":"A view is a stored query, re-run every time it is read. A materialized view stores the result and needs refreshing. MySQL has no native materialized views — use a summary table refreshed by events or ETL."}],"framework":[{"t":"Pin the grain","d":"Say out loud: \"one output row per ___\". Confirm the output columns, their names and whether order matters."},{"t":"Find tables and the preserved side","d":"Which tables hold each column? Which entity must appear even without matches (LEFT JOIN from it)? Which keys join them?"},{"t":"List the edge cases","d":"NULLs in filters and joins, duplicate rows, ties for first place, empty input (one NULL row or no rows?), inclusive/exclusive date boundaries."},{"t":"Build in logical order","d":"FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY/LIMIT. Trace 3–4 sample rows through each stage before writing the next."},{"t":"Offer an alternative and talk performance","d":"Mention the window-function vs self-join version, indexes on join and filter columns, and keeping predicates sargable (no functions on indexed columns)."}],"traps":["`= NULL` never matches — use `IS NULL`; `NULL <> 2` drops the row (#2, #11).","`NOT IN (subquery)` returns nothing if the subquery yields any NULL — prefer `NOT EXISTS` (#8, #37).","A condition on the right table in `WHERE` turns a LEFT JOIN into an INNER JOIN — put it in `ON` (#16).","After a LEFT JOIN, `COUNT(*)` counts the NULL placeholder row — count a right-table column (#12).","`UNION` silently de-duplicates — use `UNION ALL` unless you want that (#39, #41).","`RANK()` leaves gaps after ties — \"top N distinct\" means `DENSE_RANK()` (#43).","`ORDER BY … LIMIT` on an empty set gives no row — wrap in a scalar subquery or aggregate to get NULL (#28, #47).","`LENGTH()` counts bytes; `CHAR_LENGTH()` counts characters (#5).","MySQL `REGEXP` and `LIKE` are case-insensitive by default; escape `.` in patterns (#50).","\"30 days ending D inclusive\" starts at D − 29; February 2020 has 29 days — use half-open ranges (#24, #39, #49).","Aggregate first, then window: moving averages need one row per day (#40).","Window results can't be filtered in the same query's `WHERE` — use a subquery or CTE (#33, #43).","`SELECT g, MIN(d), other_col … GROUP BY g` does not return other_col from the MIN row (#25)."],"exec_order":[["FROM / JOIN","Build the working set of rows"],["WHERE","Filter rows (no aggregates, no SELECT aliases)"],["GROUP BY","Collapse rows into groups"],["HAVING","Filter groups (aggregates allowed)"],["Window functions","OVER (…) computed on the grouped rows"],["SELECT","Compute output columns; aliases are born"],["DISTINCT","Remove duplicate output rows"],["ORDER BY","Sort (aliases allowed)"],["LIMIT / OFFSET","Cut the result"]]};
</script>
<script>
"use strict";
const BY_ID = Object.fromEntries(P.map(p => [p.id, p]));
const SECS = R.sections;
const SEC = Object.fromEntries(SECS.map(s => [s.key, s]));
const LC = slug => `https://leetcode.com/problems/${slug}/description/?envType=study-plan-v2&envId=top-sql-50`;

/* ---------- storage ---------- */
const KEY = 'sql50-notebook-v1';
let persistOK = true;
function blank(){ return {solved:{}, revisit:{}, notes:{}, theme:null}; }
function loadStore(){
  try{
    const raw = localStorage.getItem(KEY);
    const s = raw ? JSON.parse(raw) : {};
    return Object.assign(blank(), s);
  }catch(e){ persistOK = false; return blank(); }
}
let S = loadStore();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ persistOK = false; } }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';
const daysAgo = ts => { const d = Math.floor((Date.now() - ts) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`; };
let CLIP = [];
const clip = t => { CLIP.push(t); return CLIP.length - 1; };
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copied to clipboard'); }catch(_){ toast('Copy blocked — select the text and copy manually'); }
    ta.remove();
  }
}

/* ---------- SQL highlighting ---------- */
const KW = new Set(('SELECT FROM WHERE AND OR NOT IN IS NULL AS ON JOIN LEFT RIGHT INNER OUTER CROSS FULL GROUP BY ORDER HAVING LIMIT OFFSET ' +
  'DISTINCT UNION ALL CASE WHEN THEN ELSE END WITH OVER PARTITION ROWS RANGE BETWEEN PRECEDING FOLLOWING CURRENT ROW UNBOUNDED DESC ASC ' +
  'INSERT INTO VALUES CREATE TABLE PRIMARY KEY DELETE UPDATE SET EXISTS LIKE REGEXP INTERVAL DAY MONTH YEAR WINDOW USING DIV MOD BINARY ' +
  'COLLATE INT VARCHAR DATE DATETIME DECIMAL ENUM BIGINT TRUE FALSE RECURSIVE SIGNED').split(' '));
const AMBIG = new Set('LEFT RIGHT IF MOD YEAR MONTH DAY DATE REPLACE INSERT BINARY'.split(' '));
function hl(code){
  const re = /(--[^\n]*)|('(?:[^'\\]|\\.)*')|(`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = '', m;
  while((m = re.exec(code))){
    if(m[1]) out += `<span class="hc">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="hs">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="hi">${esc(m[3])}</span>`;
    else if(m[4]) out += `<span class="hn">${esc(m[4])}</span>`;
    else if(m[5]){
      const w = m[5], up = w.toUpperCase();
      const call = /^\(/.test(code.slice(re.lastIndex));
      if(call && (AMBIG.has(up) || !KW.has(up))) out += `<span class="hf">${esc(w)}</span>`;
      else if(KW.has(up)) out += `<span class="hk">${esc(w)}</span>`;
      else out += esc(w);
    } else out += esc(m[6]);
  }
  return out;
}
function codeBlock(sql, cls=''){
  return `<div class="code ${cls}"><button class="copy" data-act="copy" data-clip="${clip(sql)}">Copy</button><pre><code>${hl(sql)}</code></pre></div>`;
}

/* ---------- result grid ---------- */
const isNum = v => typeof v === 'number' || (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v));
function grid(t){
  const cols = t.cols, ki = cols.indexOf('_keep'), gi = cols.indexOf('_grp');
  const vis = cols.map((c, i) => i).filter(i => i !== ki && i !== gi);
  const gmap = new Map(); let prev;
  const cls = ['grid', ki >= 0 ? 'has-keep' : '', gi >= 0 ? 'has-grp' : ''].join(' ');
  let h = `<div class="grid-wrap"><table class="${cls}"><thead><tr>`;
  for(const i of vis){ const c = cols[i], comp = c.startsWith('+'); h += `<th class="${comp ? 'comp' : ''}" scope="col">${esc(comp ? c.slice(1) : c)}</th>`; }
  h += '</tr></thead><tbody>';
  for(const r of t.rows){
    const rc = [];
    if(ki >= 0) rc.push(String(r[ki]) === '1' ? 'keep' : 'drop');
    if(gi >= 0){ const g = String(r[gi]); if(!gmap.has(g)) gmap.set(g, gmap.size % 6); rc.push('g' + gmap.get(g)); if(prev !== undefined && g !== prev) rc.push('gstart'); prev = g; }
    h += `<tr class="${rc.join(' ')}">` + vis.map(i => {
      const v = r[i], comp = cols[i].startsWith('+');
      return `<td class="${comp ? 'comp' : ''}${isNum(v) ? ' num' : ''}">${v === null ? '<span class="null">NULL</span>' : (v === '' ? '<span class="null">\'\'</span>' : esc(v))}</td>`;
    }).join('') + '</tr>';
  }
  if(!t.rows.length) h += `<tr><td class="empty" colspan="${vis.length}">empty result — no rows</td></tr>`;
  return h + '</tbody></table></div>';
}
function legend(t){
  const c = t.cols, items = [];
  if(c.includes('_keep')) items.push('<span><i class="sw keep"></i>row survives this step</span>', '<span><i class="sw drop"></i>row filtered out</span>');
  if(c.includes('_grp')) items.push('<span><i class="sw grp"></i>colour = one group</span>');
  if(c.some(x => x.startsWith('+'))) items.push('<span><i class="sw comp"></i>computed for this step</span>');
  const boolCol = c.some((x, i) => x.startsWith('+') && t.rows.length && t.rows.every(r => r[i] === null || r[i] === 0 || r[i] === 1));
  if(boolCol) items.push('<span>1 = TRUE, 0 = FALSE (MySQL booleans)</span>');
  return items.length ? `<div class="legend">${items.join('')}</div>` : '';
}

/* ---------- clause pipeline ---------- */
function stripCalls(s, name){
  let out = '', i = 0; const re = new RegExp('\\b' + name + '\\s*\\(', 'g'); let m;
  while((m = re.exec(s))){
    out += s.slice(i, m.index + m[0].length); let d = 1, j = re.lastIndex;
    while(j < s.length && d){ if(s[j] === '(') d++; else if(s[j] === ')') d--; j++; }
    out += ')'; i = j; re.lastIndex = j;
  }
  return out + s.slice(i);
}
function clauses(sql){
  let s = sql.replace(/'(?:[^'\\]|\\.)*'/g, "''").replace(/--[^\n]*/g, '').toUpperCase();
  s = stripCalls(stripCalls(s, 'OVER'), 'GROUP_CONCAT');
  const has = re => re.test(s);
  const steps = [
    ['FROM', has(/\bFROM\b/)], ['JOIN', has(/\bJOIN\b/)], ['WHERE', has(/\bWHERE\b/)], ['GROUP BY', has(/\bGROUP\s+BY\b/)],
    ['HAVING', has(/\bHAVING\b/)], ['OVER()', /\bOVER\b/.test(sql.toUpperCase())], ['SELECT', has(/\bSELECT\b/)],
    ['DISTINCT', has(/\bSELECT\s+DISTINCT\b/)], ['UNION', has(/\bUNION\b/)], ['ORDER BY', has(/\bORDER\s+BY\b/)], ['LIMIT', has(/\bLIMIT\b/)]
  ];
  const extra = [];
  if(/^\s*WITH\b/.test(s)) extra.push('CTE');
  const sub = s.replace(/(^|UNION(\s+ALL)?)\s*\(\s*SELECT\b/g, '$1 SELECT').replace(/\bAS\s*\(\s*SELECT\b/g, 'AS SELECT');
  if(/\(\s*SELECT\b/.test(sub)) extra.push('subquery');
  if(/^\s*DELETE\b/.test(s)) extra.push('DELETE');
  return {steps, extra};
}
function pipeline(sql){
  const {steps, extra} = clauses(sql);
  return `<div class="pipeline" aria-label="Clauses used">${steps.map(([n, on]) => `<span class="pipe ${on ? 'on' : ''}">${n}</span>`).join('')}
    ${extra.length ? `<span class="pipe-extra">${extra.map(e => `<span class="chip mono">${e}</span>`).join('')}</span>` : ''}</div>
    <div class="pipe-cap">Highlighted clauses appear in this query, shown in the order MySQL logically evaluates them.</div>`;
}

    body = `<p class="lede" style="margin-top:20px">Sixteen shapes cover all fifty problems. In an interview, name the pattern first, then write the template.</p>` +
      R.patterns.map(pt => `<div class="pat"><div><h3>${esc(pt.name)}</h3><p class="when">${md(pt.when)}</p>
        <div class="chips">${pt.ids.map(id => `<a class="chip" href="#/p/${id}" title="${esc(BY_ID[id].title)}">${BY_ID[id].n}. ${esc(BY_ID[id].title.length > 26 ? BY_ID[id].title.slice(0, 25) + '…' : BY_ID[id].title)}</a>`).join('')}</div></div>
        <div>${codeBlock(pt.code, 'small')}</div></div>`).join('');
  } else if(tab === 'cheatsheet'){
    body = `<p class="lede" style="margin-top:20px">The MySQL functions SQL 50 actually uses, plus the few interviewers ask about next.</p>` +
      R.cheatsheet.map(g => `<h2 style="margin-top:30px">${esc(g.group)}</h2><table class="cheat"><thead><tr><th>Function</th><th>What it does</th><th>Example</th></tr></thead><tbody>
        ${g.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`).join('');
  } else if(tab === 'concepts'){
    body = `<div class="toolbar"><button class="btn" data-act="qa-all" data-open="1">Expand all</button><button class="btn" data-act="qa-all" data-open="0">Collapse all</button>
      <span class="muted small">Try answering aloud before opening each one.</span></div>` +
      R.concepts.map(c => `<details class="qa"><summary>${md(c.q)}</summary><div class="ans">${md(c.a)}</div></details>`).join('');
  } else if(tab === 'drill'){
    if(arg === 'revisit' && DR.pool !== 'revisit'){ DR.pool = 'revisit'; DR.order = null; }
    if(!DR.order) resetDrill(false);
    const ids = DR.order;
    const opts = [['all', 'All 50'], ['revisit', `Revisit list (${Object.keys(S.revisit).length})`]].concat(SECS.map(s => ['sec:' + s.key, s.name]));
    let card;
    if(!ids.length) card = `<div class="empty-state">${DR.pool === 'revisit' ? 'Your revisit list is empty. Star problems to drill them here.' : 'No problems in this selection.'}</div>`;
    else {
      DR.i = Math.min(DR.i, ids.length - 1);
      const p = BY_ID[ids[DR.i]];
      card = `<div class="card">
        <div class="card-top"><span>Card ${DR.i + 1} of ${ids.length}</span><span class="chips"><span class="chip diff ${p.diff}">${p.diff}</span><span class="chip">${esc(SEC[p.sec].name)}</span></span></div>
        <h3>${p.n}. ${esc(p.title)}</h3>
        <p>${md(p.prompt)}</p>
        <p class="returns">Return: <code>${esc(p.returns)}</code></p>
        ${DR.revealed ? `<div class="reveal">
            <p class="small muted" style="margin:0">Pattern</p><p><b>${md(p.pattern)}</b></p>
            <p class="small muted" style="margin:0">Recall line</p><span class="recall">${md(p.recall)}</span>
            ${codeBlock(p.solution, 'small')}
            <div class="actions"><a class="btn" href="#/p/${p.id}">Open full page</a>
              <button class="btn ${S.revisit[p.id] ? 'on-star' : ''}" data-act="revisit" data-id="${p.id}">★ ${S.revisit[p.id] ? 'On revisit list' : 'Add to revisit'}</button></div>
          </div>` : ''}
        <div class="drill-nav">
          <button class="btn" data-act="drill-prev" ${DR.i === 0 ? 'disabled' : ''}>◀ Previous</button>
          ${DR.revealed ? '' : '<button class="btn primary" data-act="drill-reveal">Reveal answer</button>'}
          <button class="btn ${DR.revealed ? 'primary' : ''}" data-act="drill-next" ${DR.i === ids.length - 1 ? 'disabled' : ''}>Next ▶</button>
        </div></div>`;
    }
    body = `<div class="toolbar"><label class="small muted" for="pool">Cards from</label>
      <select class="sel" id="pool">${opts.map(([v, l]) => `<option value="${v}" ${DR.pool === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <button class="btn" data-act="drill-shuffle">Shuffle</button><button class="btn ghost" data-act="drill-order">Plan order</button>
      <span class="muted small">Say the pattern and sketch the query before revealing. <kbd>Space</kbd> reveals, <kbd>→</kbd> next.</span></div>${card}`;
  } else if(tab === 'checklist'){
    body = `<h2>How to attack any SQL question</h2><ol class="frame">${R.framework.map(f => `<li><div><b>${esc(f.t)}</b>${md(f.d)}</div></li>`).join('')}</ol>
      <h2>Logical order of execution</h2><div class="order">${R.exec_order.map((o, i) => `<div><span class="ix">${i + 1}</span><span class="on">${esc(o[0])}</span><span class="muted small">${esc(o[1])}</span></div>`).join('')}</div>
      <h2>Last-minute traps</h2><ul class="notes traps">${R.traps.map(t => `<li>${md(t)}</li>`).join('')}</ul>`;
  }
  $('#page').innerHTML = `<h1>Interview revision</h1>
    <p class="lede">For the night before: the patterns behind the fifty problems, the functions you need, the theory questions that follow a SQL round, and a flashcard drill.</p>
    <nav class="tabs" aria-label="Revision sections">${TABS.map(([k, l]) => `<a href="#/interview/${k}" aria-current="${k === tab ? 'page' : 'false'}">${l}</a>`).join('')}</nav>${body}`;
}

/* ---------- actions ---------- */
function toggleSolved(id){
  if(S.solved[id]) delete S.solved[id]; else S.solved[id] = Date.now();
  save(); toast(S.solved[id] ? 'Marked solved' : 'Marked unsolved');
}
function toggleRevisit(id){
  if(S.revisit[id]) delete S.revisit[id]; else S.revisit[id] = {added: Date.now(), reviewed: null, count: 0};
  save(); toast(S.revisit[id] ? 'Added to revisit list' : 'Removed from revisit list');
}
function exportData(){
  const blob = new Blob([JSON.stringify({app:'sql50-notebook', version:1, exported:new Date().toISOString(), data:S}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `sql50-progress-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Progress file downloaded');
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const j = JSON.parse(fr.result), d = j.data || j;
      if(typeof d !== 'object' || !d) throw 0;
      Object.assign(S.solved, d.solved || {});
      for(const [id, r] of Object.entries(d.revisit || {})){ const cur = S.revisit[id]; if(!cur || (r.reviewed || 0) > (cur.reviewed || 0)) S.revisit[id] = r; }
      for(const [id, n] of Object.entries(d.notes || {})){ if(n && n.trim()) S.notes[id] = n; }
      save(); render(); toast('Progress imported and merged');
    }catch(e){ toast('That file is not a SQL 50 progress export'); }
  };
  fr.readAsText(file);
}
function applyTheme(){ if(S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
function openNav(){ $('#side').classList.add('open'); $('#scrim').classList.add('show'); }
function closeNav(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = +el.dataset.id;
  switch(act){
    case 'copy': copyText(CLIP[+el.dataset.clip]); break;
    case 'solved': toggleSolved(id); render(); break;
    case 'revisit': toggleRevisit(id); render(); break;
    case 'reviewed': { const r = S.revisit[id]; r.reviewed = Date.now(); r.count = (r.count || 0) + 1; save(); toast('Marked reviewed today'); render(); break; }
    case 'step': stepIdx = +el.dataset.i; renderStepper(); break;
    case 'step-prev': stepIdx--; renderStepper(); break;
    case 'step-next': stepIdx++; renderStepper(); break;
    case 'step-sql': showStepSql = !showStepSql; renderStepper(); break;
    case 'rm-filter': RM[el.dataset.k] = el.dataset.v; render(); break;
    case 'jump': $('#' + el.dataset.target)?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'jump-after': e.preventDefault(); location.hash = '#/roadmap'; setTimeout(() => $('#' + el.dataset.target)?.scrollIntoView({block:'start'}), 30); break;
    case 'theme': S.theme = S.theme === null ? 'light' : S.theme === 'light' ? 'dark' : null; save(); applyTheme(); renderSide(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'qa-all': document.querySelectorAll('details.qa').forEach(d => d.open = el.dataset.open === '1'); break;
    case 'drill-prev': DR.i--; DR.revealed = false; render(); break;
    case 'drill-next': DR.i++; DR.revealed = false; render(); break;
    case 'drill-reveal': DR.revealed = true; render(); break;
    case 'drill-shuffle': resetDrill(true); render(); toast('Cards shuffled'); break;
    case 'drill-order': resetDrill(false); render(); break;
    case 'nav-open': openNav(); break;
    case 'nav-close': closeNav(); break;
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'importFile' && e.target.files[0]){ importData(e.target.files[0]); e.target.value = ''; }
  if(e.target.id === 'pool'){ DR.pool = e.target.value; resetDrill(false); history.replaceState(null, '', '#/interview/drill'); render(); }
});
let noteTimer;
document.addEventListener('input', e => {
  if(e.target.id === 'q') applyFilter();
  if(e.target.id === 'notes'){
    const id = +e.target.dataset.id, v = e.target.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { if(v.trim()) S.notes[id] = v; else delete S.notes[id]; save(); $('#saved').textContent = v.trim() ? 'Saved in this browser' : ''; }, 400);
  }
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'q' && e.key === 'Enter'){ const a = [...document.querySelectorAll('.tree a')].find(x => x.style.display !== 'none'); if(a){ location.hash = a.getAttribute('href'); e.target.blur(); } return; }
  if(e.target.id === 'q' && e.key === 'Escape'){ e.target.value = ''; applyFilter(); e.target.blur(); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = parseRoute();
  if(e.key === '/'){ e.preventDefault(); if(innerWidth <= 960) openNav(); $('#q').focus(); return; }
  if(r.view === 'problem'){
    const i = P.findIndex(p => p.id === r.id);
    if(e.key === 'ArrowRight'){ stepIdx++; renderStepper(); }
    else if(e.key === 'ArrowLeft'){ stepIdx--; renderStepper(); }
    else if(e.key === ']' && P[i + 1]) location.hash = '#/p/' + P[i + 1].id;
    else if(e.key === '[' && P[i - 1]) location.hash = '#/p/' + P[i - 1].id;
  } else if(r.view === 'interview' && r.tab === 'drill' && DR.order && DR.order.length){
    if(e.key === ' '){ e.preventDefault(); if(!DR.revealed){ DR.revealed = true; render(); } }
    else if(e.key === 'ArrowRight' && DR.i < DR.order.length - 1){ DR.i++; DR.revealed = false; render(); }
    else if(e.key === 'ArrowLeft' && DR.i > 0){ DR.i--; DR.revealed = false; render(); }
  }
});
window.addEventListener('hashchange', render);
window.addEventListener('storage', e => { if(e.key === KEY){ S = loadStore(); render(); } });
applyTheme();
render();
</script>
</body>
</html>
